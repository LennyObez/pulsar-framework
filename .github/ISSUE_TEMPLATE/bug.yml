name: Bug Report
description: Report a bug in Pulsar Framework
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Configure '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: pulsar-version
    attributes:
      label: Pulsar version
      options:
        - 1.0.0-rc.11
        - 1.0.0-rc.10
        - Other
    validations:
      required: true
  - type: dropdown
    id: php-version
    attributes:
      label: PHP version
      options:
        - '8.5'
        - '8.4'
        - '8.3'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other relevant information, logs, or screenshots.
    validations:
      required: false
