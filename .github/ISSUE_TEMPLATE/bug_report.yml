name: Bug report
description: Report a defect in Pulsar Framework
title: "[Bug]: "
labels: ["type/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Accurate reports enable fast resolution.
        For security vulnerabilities, **do not open a public issue**. Use [GitHub Security Advisories](https://github.com/LennyObez/pulsar-framework/security/advisories/new) instead.

  - type: input
    id: version
    attributes:
      label: Pulsar Framework version
      description: "`cargo tree -p pulsar-framework --depth 1` or the tag (e.g. v0.1.0-alpha.3)"
      placeholder: "0.1.0-alpha.3"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust toolchain version
      description: "`rustc --version`"
      placeholder: "rustc 1.95.0 (2026-03-20)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (glibc)
        - Linux (musl)
        - macOS (x86_64)
        - macOS (aarch64)
        - Windows (MSVC)
        - WSL2
        - Other (specify in details)
    validations:
      required: true

  - type: dropdown
    id: crate
    attributes:
      label: Affected crate
      options:
        - pulsar-framework (meta)
        - pulsar-kernel
        - pulsar-http
        - pulsar-engine
        - pulsar-orm
        - pulsar-audit
        - pulsar-auth
        - pulsar-compliance
        - pulsar-observability
        - pulsar-cms
        - pulsar-forum
        - pulsar-payments
        - pulsar-console
        - pulsar-cli
        - pulsar-test
        - Unknown / multiple
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-paragraph description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal, complete, reproducible example. Include code snippet if possible.
      placeholder: |
        1. `cargo new minimal-repro`
        2. Add dependency: `pulsar-http = "0.1.0"`
        3. Run `cargo test --test <name>`
        4. Observe error: ...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces, logs.
      render: text
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Configuration, related issues, screenshots, anything that helps triage.

  - type: checkboxes
    id: terms
    attributes:
      label: Compliance
      options:
        - label: This is not a security vulnerability. If it is, I will file a private advisory instead.
          required: true
        - label: I have searched existing issues for duplicates.
          required: true
