name: 'Tier B: Nightly Performance Benchmarks'

on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch:

concurrency:
  group: benchmark-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tier-b-benchmarks:
    name: 'Tier B: Nightly Benchmarks (Real Backends)'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pulsar_bench
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: pulsar_bench

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version-file: .php-version
          extensions: sodium, redis, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The isolated analyser tree (vendor-bin/, bamarni/composer-bin-plugin) is
          # cached alongside the root one, and its lock is part of the key: without
          # it a Psalm version change would silently reuse the old cache entry.
          path: |
            vendor
            vendor-bin/*/vendor
          key: composer-${{ hashFiles('composer.lock', 'vendor-bin/*/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      # Generate a per-run master key instead of baking a
      # public hex value into the workflow file. Otherwise any
      # cache / preload / migration artefact encrypted under the
      # baked key is decryptable by anyone reading the repo, and
      # the key value itself drifts into staging deployments via
      # copy-paste.
      - name: Generate ephemeral master key
        run: echo "PULSAR_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: 'Tier B: Run all benchmarks (broader tolerance)'
        continue-on-error: true
        run: composer bench:ci 2>&1 | tee benchmark-tier-b.txt

      - name: 'Tier B: Run memory peak benchmarks'
        continue-on-error: true
        run: |
          echo "Running memory peak benchmarks..."
          php tests/Benchmark/Scenarios/memory_anonymous.php
          php tests/Benchmark/Scenarios/memory_authenticated.php
          php tests/Benchmark/Scenarios/memory_compliance.php

      - name: Upload Tier B results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-tier-b-${{ github.run_number }}
          path: |
            benchmark-tier-b.txt
            var/bench/results.json
          retention-days: 30

      - name: Add results to job summary
        if: always()
        run: |
          {
            echo '## Tier B: Nightly Benchmark Results'
            echo ''
            echo '```'
            cat benchmark-tier-b.txt 2>/dev/null || echo "(no results)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
