name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP Quality (CS, PHPStan, Psalm, Boundaries)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      # F23.1 / F385.1 / F385.M2 / F387.1 / F387.M3: assert that the
      # version reported by Pulsar\Core\Version matches composer.json,
      # so a release PR cannot bump one without bumping the other.
      - name: Version constants consistency
        run: bash tools/ci/check-version-consistency.sh

      - run: composer cs:check

      - run: composer phpstan

      - run: composer psalm

      - name: Fetch base ref for boundary diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      - name: Boundary enforcement (Deptrac)
        run: composer boundary:deptrac

      - name: Boundary enforcement (API targeting)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: php scripts/boundary_check.php --diff-base="origin/$BASE_REF"

      - name: Boundary enforcement (API targeting, full scan)
        if: github.event_name != 'pull_request'
        run: php scripts/boundary_check.php

      - name: Audit dependencies for vulnerabilities
        run: composer audit --abandoned=report

  php-tests:
    name: PHP Tests (Unit, Integration, E2E)
    runs-on: ubuntu-latest
    needs: php-quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pulsar_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pulsar_test
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_DATABASE: pulsar_test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          # Xdebug 3.x required for branch + path coverage (PCOV only measures
          # lines). The mandate targets 100 % line + branch + condition coverage
          # so Xdebug is the only production-capable choice today.
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Run all tests with line + branch + path coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          php -d memory_limit=4G \
              -d xdebug.mode=coverage \
              vendor/bin/phpunit \
                -c tools/php/phpunit.xml \
                --coverage-clover coverage/clover.xml \
                --path-coverage

      - name: Enforce coverage threshold (lines + branches + paths)
        run: |
          php -r '
            $xml = simplexml_load_file("coverage/clover.xml");
            $metrics = $xml->project->metrics;
            $stmts = (int) $metrics["statements"];
            $stmtsCov = (int) $metrics["coveredstatements"];
            $stmtPct = $stmts > 0 ? round(($stmtsCov / $stmts) * 100, 2) : 0;

            $conds = (int) ($metrics["conditionals"] ?? 0);
            $condsCov = (int) ($metrics["coveredconditionals"] ?? 0);
            $condPct = $conds > 0 ? round(($condsCov / $conds) * 100, 2) : 0;

            $methods = (int) ($metrics["methods"] ?? 0);
            $methodsCov = (int) ($metrics["coveredmethods"] ?? 0);
            $methodPct = $methods > 0 ? round(($methodsCov / $methods) * 100, 2) : 0;

            echo "Statements : {$stmtPct}% ({$stmtsCov}/{$stmts})\n";
            echo "Conditions : {$condPct}% ({$condsCov}/{$conds})\n";
            echo "Methods    : {$methodPct}% ({$methodsCov}/{$methods})\n";

            $threshold = 70; // TODO TD-006: ramp 70 -> 90 -> 95 -> 100
            $failed = false;
            foreach (["Statements" => $stmtPct, "Conditions" => $condPct, "Methods" => $methodPct] as $name => $pct) {
                if ($pct < $threshold) {
                    echo "FAIL: {$name} coverage {$pct}% is below the {$threshold}% threshold.\n";
                    $failed = true;
                }
            }
            exit($failed ? 1 : 0);
          '

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-unit
          path: .phpunit.cache/
          retention-days: 7

  php-benchmark-tier-a:
    name: 'Tier A: Performance Budgets (Hard Gate)'
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          extensions: sodium, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Verify pipeline manifest integrity
        run: |
          MANIFEST_HASH=$(php -r "echo hash_file('sha256', 'tools/php/bench-pipeline.manifest.php');")
          echo "Pipeline manifest hash: $MANIFEST_HASH"
          echo "manifest_hash=$MANIFEST_HASH" >> "$GITHUB_ENV"

      - name: 'Tier A: Run PHPBench with assertions (hard gate)'
        run: composer bench:ci 2>&1 | tee benchmark-tier-a.txt

      - name: 'Tier A: Run memory peak budgets'
        run: |
          echo "Running memory peak benchmarks in isolated processes..."
          php tests/Benchmark/Scenarios/memory_anonymous.php > /dev/null && echo "PASS: memory_anonymous"
          php tests/Benchmark/Scenarios/memory_authenticated.php > /dev/null && echo "PASS: memory_authenticated"
          php tests/Benchmark/Scenarios/memory_compliance.php > /dev/null && echo "PASS: memory_compliance"

      - name: Run OPcache/JIT/preload profile matrix
        continue-on-error: true
        run: composer bench:profiles:ci | tee benchmark-profiles.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-tier-a
          path: |
            benchmark-tier-a.txt
            benchmark-profiles.txt
            var/bench/results.json
          retention-days: 14

      - name: Add benchmark results to job summary
        if: always()
        run: |
          echo '## Tier A: Performance Budget Results (Hard Gate)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline manifest SHA-256: \`${{ env.manifest_hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-tier-a.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## OPcache / JIT / Preload Profile Matrix' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-profiles.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  php-mutation:
    name: Mutation Testing (Infection)
    runs-on: ubuntu-latest
    needs: php-tests

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sodium
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Run Infection mutation testing
        run: composer mutation
        env:
          XDEBUG_MODE: coverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: infection-report
          path: |
            build/infection/infection.log
            build/infection/summary.log
            build/infection/infection.json
          retention-days: 7

  php-benchmark-library:
    name: PHPBench (benchmarks/ suite)
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sodium
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Run benchmarks/ suite
        run: |
          vendor/bin/phpbench run benchmarks/ \
            --bootstrap=vendor/autoload.php \
            --report=default \
            --progress=none \
            --iterations=3 \
            --revs=100 \
            --warmup=1 \
            --time-unit=microseconds \
            2>&1 | tee benchmark-library.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-library
          path: benchmark-library.txt
          retention-days: 14

      - name: Add benchmark results to job summary
        if: always()
        run: |
          echo '## PHPBench Library Benchmarks' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-library.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  cache-warmup:
    name: Cache Warmup Smoke Test
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Verify cache warmup pipeline
        # F28.4: do not bake a fixed master key into CI yaml. The
        # previous hardcoded `0123...cdef` value was 32 bytes of
        # entirely-public-knowledge entropy; cache artefacts encrypted
        # under it (uploaded by later steps) were trivially decryptable
        # by anyone reading the workflow file. Generate per-run instead
        # via openssl. The key is exported only inside this step and
        # is not persisted between jobs.
        run: |
          export PULSAR_MASTER_KEY="$(openssl rand -hex 32)"
          if php bin/pulsar list 2>/dev/null | grep -q 'optimize:validate'; then
            php bin/pulsar optimize:validate --strict
          else
            php bin/pulsar optimize
            php bin/pulsar optimize:clear
          fi

  adr-check:
    name: ADR Governance Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Fetch base ref (fork-safe)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch origin "$BASE_SHA" --depth=1

      - name: Check ADR governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-adr.sh

  js:
    name: JS/TS (Lint, Format, Typecheck, Test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
