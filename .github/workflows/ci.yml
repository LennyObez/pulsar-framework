name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP Quality (CS, PHPStan, Psalm, Boundaries)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - run: composer cs:check

      - run: composer phpstan

      - run: composer psalm

      - name: Fetch base ref for boundary diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Boundary enforcement (Deptrac)
        run: composer boundary:deptrac

      - name: Boundary enforcement (API targeting)
        if: github.event_name == 'pull_request'
        run: php scripts/boundary_check.php --diff-base=origin/${{ github.base_ref }}

      - name: Boundary enforcement (API targeting, full scan)
        if: github.event_name != 'pull_request'
        run: php scripts/boundary_check.php

      - name: Audit dependencies for vulnerabilities
        run: composer audit --abandoned=report

  php-tests:
    name: PHP Tests (Unit, Integration, E2E)
    runs-on: ubuntu-latest
    needs: php-quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pulsar_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pulsar_test
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_DATABASE: pulsar_test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Run all tests with coverage
        run: php -d memory_limit=3G -d pcov.directory=. vendor/bin/phpunit -c tools/php/phpunit.xml --coverage-clover coverage/clover.xml

      - name: Enforce coverage threshold
        run: |
          php -r '
            $xml = simplexml_load_file("coverage/clover.xml");
            $metrics = $xml->project->metrics;
            $stmts = (int) $metrics["statements"];
            $covered = (int) $metrics["coveredstatements"];
            $pct = $stmts > 0 ? round(($covered / $stmts) * 100, 2) : 0;
            echo "Coverage: {$pct}% ({$covered}/{$stmts} statements)\n";
            if ($pct < 50) {
                echo "FAIL: Coverage {$pct}% is below the 50% threshold.\n";
                exit(1);
            }
            echo "PASS: Coverage meets the 50% threshold.\n";
          '

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: .phpunit.cache/
          retention-days: 7

  php-benchmark-tier-a:
    name: 'Tier A: Performance Budgets (Hard Gate)'
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sodium, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Verify pipeline manifest integrity
        run: |
          MANIFEST_HASH=$(php -r "echo hash_file('sha256', 'tools/php/bench-pipeline.manifest.php');")
          echo "Pipeline manifest hash: $MANIFEST_HASH"
          echo "manifest_hash=$MANIFEST_HASH" >> "$GITHUB_ENV"

      - name: 'Tier A: Run PHPBench with assertions (hard gate)'
        run: composer bench:ci 2>&1 | tee benchmark-tier-a.txt

      - name: 'Tier A: Run memory peak budgets'
        run: |
          echo "Running memory peak benchmarks in isolated processes..."
          php tests/Benchmark/Scenarios/memory_anonymous.php > /dev/null && echo "PASS: memory_anonymous"
          php tests/Benchmark/Scenarios/memory_authenticated.php > /dev/null && echo "PASS: memory_authenticated"
          php tests/Benchmark/Scenarios/memory_compliance.php > /dev/null && echo "PASS: memory_compliance"

      - name: Run OPcache/JIT/preload profile matrix
        continue-on-error: true
        run: composer bench:profiles:ci | tee benchmark-profiles.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-tier-a
          path: |
            benchmark-tier-a.txt
            benchmark-profiles.txt
            var/bench/results.json
          retention-days: 14

      - name: Add benchmark results to job summary
        if: always()
        run: |
          echo '## Tier A: Performance Budget Results (Hard Gate)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline manifest SHA-256: \`${{ env.manifest_hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-tier-a.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## OPcache / JIT / Preload Profile Matrix' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-profiles.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  cache-warmup:
    name: Cache Warmup Smoke Test
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Verify cache warmup pipeline
        env:
          PULSAR_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          if php bin/pulsar list 2>/dev/null | grep -q 'optimize:validate'; then
            php bin/pulsar optimize:validate --strict
          else
            php bin/pulsar optimize
            php bin/pulsar optimize:clear
          fi

  adr-check:
    name: ADR Governance Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref (fork-safe)
        run: git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1

      - name: Check ADR governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-adr.sh

  js:
    name: JS/TS (Lint, Format, Typecheck, Test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
