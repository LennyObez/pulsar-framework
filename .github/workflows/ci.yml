name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP Quality (CS, PHPStan, Psalm, Boundaries)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          # imagick + gd are loaded so Psalm/PHPStan can resolve the
          # optional image-processing code paths in extensions/cms.
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, imagick, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      # F23.1 / F385.1 / F385.M2 / F387.1 / F387.M3: assert that the
      # version reported by Pulsar\Core\Version matches composer.json,
      # so a release PR cannot bump one without bumping the other.
      - name: Version constants consistency
        run: bash tools/ci/check-version-consistency.sh

      - run: composer cs:check

      - run: composer phpstan

      - run: composer psalm

      - name: Fetch base ref for boundary diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF" --depth=1

      # F387.4 / F387.M2 / F380.M1: PR titles using `chore:` or `docs:`
      # while adding new src/ modules or new extensions get less
      # reviewer attention than they need. Block at CI time so the
      # title gets renamed before merge.
      - name: PR title scope strictness
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/ci/check-pr-title-scope.sh

      # F387.M1 / ADR-0031: enforce the 1500-line PR cap. Mega-PRs
      # that bundle whole release cycles into single squash-merge
      # diffs are review-resistant and break git-bisect granularity.
      # Hard cap at 1500 lines of substantive diff (excluding
      # lockfiles + generated code per .size-limit-ignore); above
      # that, the PR needs the `oversize-pr-acknowledged` label
      # AND a `/oversize-pr-approved` comment from a CODEOWNER
      # other than the PR author.
      - name: PR size limit (ADR-0031)
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
          REPO_FULL: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/check-pr-size.sh

      # PSR-4 conformance is a correctness gate, not style: composer's optimized
      # classmap hides a namespace/path mismatch (the class still resolves), and
      # `--strict-psr` only WARNS while still exiting 0. A mismatch that works on
      # case-insensitive Windows or macOS fails to autoload on this Linux runner,
      # and a class declared in a sibling's file is unreachable the moment nothing
      # has included that file — the same fragility that broke 66 tests under
      # parallel execution.
      - name: PSR-4 autoload conformance
        run: composer autoload:check

      - name: Boundary enforcement (Deptrac)
        run: composer boundary:deptrac

      - name: Boundary enforcement (API targeting)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: php scripts/boundary_check.php --diff-base="origin/$BASE_REF"

      - name: Boundary enforcement (API targeting, full scan)
        if: github.event_name != 'pull_request'
        run: php scripts/boundary_check.php

      - name: Audit dependencies for vulnerabilities
        run: composer audit --abandoned=report

  php-tests:
    name: PHP Tests (Unit, Integration, E2E)
    runs-on: ubuntu-latest
    needs: php-quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pulsar_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pulsar_test
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3

      # Real backends for the cache/lock driver contract tests: without these
      # servers the Redis/Memcached driver tests self-skip and the drivers are
      # never exercised against a real integration anywhere.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_DATABASE: pulsar_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          # Load the REAL optional extensions so the driver contract tests, the
          # igbinary serializer, and the zstd compression path run against real
          # integrations instead of self-skipping. Every symbol in
          # tools/php/stubs/ must have a real counterpart here — the contract is
          # asserted below, not assumed. (ext-brotli is built separately: it is
          # in neither Ondřej's PPA nor PECL, so setup-php cannot resolve it.)
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, redis, memcached, apcu, igbinary, zstd
          ini-values: apc.enable_cli=1
          # Xdebug 3.x required for branch + path coverage (PCOV only measures
          # lines). The mandate targets 100 % line + branch + condition coverage
          # so Xdebug is the only production-capable choice today.
          coverage: xdebug

      # ext-brotli ships in neither Ondřej's PPA nor PECL, so setup-php cannot
      # install it — it has to be built. It is worth the ~1 min: 'br' leads
      # server preference in CompressionMiddleware and every browser requests
      # it, so without this the single most-used compression path in the
      # framework would never execute in CI even once.
      - name: Build and install ext-brotli
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libbrotli-dev
          git clone --depth=1 https://github.com/kjdev/php-ext-brotli.git /tmp/php-ext-brotli
          cd /tmp/php-ext-brotli
          phpize
          ./configure --with-libbrotli
          make -j"$(nproc)"
          sudo make install
          echo 'extension=brotli.so' | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-brotli.ini"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      # Guards against green-by-abstention: if an optional extension silently
      # fails to install, every test behind its function_exists() guard skips
      # and the job still passes. Fail loudly instead.
      - name: Assert the optional-extension contract
        run: php tools/ci/assert-extensions.php redis memcached apcu igbinary zstd brotli

      # Fast, no-coverage parallel run FIRST: it fails in minutes instead of after
      # the full path-coverage pass, and it is the only thing that guards test
      # isolation. A helper class declared inside a sibling test file, or a fixture
      # written to a literal temp path, works under sequential execution and breaks
      # here — which is exactly how 66 such errors were found. Coverage stays on the
      # sequential run below: merging PATH coverage across workers is far less
      # exercised, and wrong numbers in a threshold gate are worse than a slow gate.
      - name: Run all tests in parallel (isolation guard, no coverage)
        env:
          XDEBUG_MODE: 'off'
        run: |
          php -d memory_limit=2G \
              vendor/bin/paratest \
                -c tools/php/phpunit.xml \
                --runner=WrapperRunner \
                --processes=$(nproc)

      - name: Run all tests with line + branch + path coverage
        env:
          XDEBUG_MODE: coverage
        run: |
          php -d memory_limit=4G \
              -d xdebug.mode=coverage \
              vendor/bin/phpunit \
                -c tools/php/phpunit.xml \
                --coverage-clover coverage/clover.xml \
                --path-coverage

      - name: Enforce coverage threshold (lines + branches + paths)
        run: |
          php -r '
            $xml = simplexml_load_file("coverage/clover.xml");
            $metrics = $xml->project->metrics;
            $stmts = (int) $metrics["statements"];
            $stmtsCov = (int) $metrics["coveredstatements"];
            $stmtPct = $stmts > 0 ? round(($stmtsCov / $stmts) * 100, 2) : 0;

            $conds = (int) ($metrics["conditionals"] ?? 0);
            $condsCov = (int) ($metrics["coveredconditionals"] ?? 0);
            $condPct = $conds > 0 ? round(($condsCov / $conds) * 100, 2) : 0;

            $methods = (int) ($metrics["methods"] ?? 0);
            $methodsCov = (int) ($metrics["coveredmethods"] ?? 0);
            $methodPct = $methods > 0 ? round(($methodsCov / $methods) * 100, 2) : 0;

            echo "Statements : {$stmtPct}% ({$stmtsCov}/{$stmts})\n";
            echo "Conditions : {$condPct}% ({$condsCov}/{$conds})\n";
            echo "Methods    : {$methodPct}% ({$methodsCov}/{$methods})\n";

            // QUAL-COV-01 (external audit): coverage gate ramps over the rc.x
            // window. Step 1 (rc.12): 80 for core, brings the security path
            // up to par. Step 2 (rc.13): per-module gates at 95 for
            // auth/security/crypto/audit. Step 3 (1.0.0 GA): 90 global.
            $threshold = 80;
            $failed = false;
            foreach (["Statements" => $stmtPct, "Conditions" => $condPct, "Methods" => $methodPct] as $name => $pct) {
                if ($pct < $threshold) {
                    echo "FAIL: {$name} coverage {$pct}% is below the {$threshold}% threshold.\n";
                    $failed = true;
                }
            }
            exit($failed ? 1 : 0);
          '

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit
          path: .phpunit.cache/
          retention-days: 7

  php-benchmark-tier-a:
    name: 'Tier A: Performance Budgets (Hard Gate)'
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: sodium, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Verify pipeline manifest integrity
        run: |
          MANIFEST_HASH=$(php -r "echo hash_file('sha256', 'tools/php/bench-pipeline.manifest.php');")
          echo "Pipeline manifest hash: $MANIFEST_HASH"
          echo "manifest_hash=$MANIFEST_HASH" >> "$GITHUB_ENV"

      - name: 'Tier A: Run PHPBench with assertions (hard gate)'
        run: composer bench:ci 2>&1 | tee benchmark-tier-a.txt

      - name: 'Tier A: Run memory peak budgets'
        run: |
          echo "Running memory peak benchmarks in isolated processes..."
          php tests/Benchmark/Scenarios/memory_anonymous.php > /dev/null && echo "PASS: memory_anonymous"
          php tests/Benchmark/Scenarios/memory_authenticated.php > /dev/null && echo "PASS: memory_authenticated"
          php tests/Benchmark/Scenarios/memory_compliance.php > /dev/null && echo "PASS: memory_compliance"

      - name: Run OPcache/JIT/preload profile matrix
        # PERF-JIT-01: previously continue-on-error to tolerate unstable JIT
        # output. Removed so the gate actually blocks GA releases on a broken
        # profile matrix. Genuine timing variance is handled inside
        # `composer bench:profiles:ci` via warmup + statistical thresholds.
        run: composer bench:profiles:ci | tee benchmark-profiles.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-tier-a
          path: |
            benchmark-tier-a.txt
            benchmark-profiles.txt
            var/bench/results.json
          retention-days: 14

      - name: Add benchmark results to job summary
        if: always()
        run: |
          echo '## Tier A: Performance Budget Results (Hard Gate)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline manifest SHA-256: \`${{ env.manifest_hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-tier-a.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## OPcache / JIT / Preload Profile Matrix' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-profiles.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  php-mutation:
    name: Mutation Testing (Infection)
    runs-on: ubuntu-latest
    needs: php-tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sodium
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Run Infection mutation testing
        run: composer mutation
        env:
          XDEBUG_MODE: coverage

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-report
          path: |
            build/infection/infection.log
            build/infection/summary.log
            build/infection/infection.json
          retention-days: 7

  php-benchmark-library:
    name: PHPBench (benchmarks/ suite)
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sodium
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Run benchmarks/ suite
        run: |
          vendor/bin/phpbench run benchmarks/ \
            --bootstrap=vendor/autoload.php \
            --report=default \
            --progress=none \
            --iterations=3 \
            --revs=100 \
            --warmup=1 \
            --time-unit=microseconds \
            2>&1 | tee benchmark-library.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-library
          path: benchmark-library.txt
          retention-days: 14

      - name: Add benchmark results to job summary
        if: always()
        run: |
          echo '## PHPBench Library Benchmarks' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark-library.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no results)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  cache-warmup:
    name: Cache Warmup Smoke Test
    runs-on: ubuntu-latest
    needs: php-quality

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress

      - name: Assert the kernel boots
        # No-compromise boot gate: a boot regression (an untrusted bundled
        # extension capped to community, a route collision, a wiring fault) must
        # fail CI directly. Run bin/pulsar with NO output/error suppression so a
        # non-zero exit — i.e. Kernel::boot() throwing — fails the job. This is
        # the guard that the cache-warmup probe below (which pipes through grep)
        # cannot provide on its own.
        run: |
          export PULSAR_MASTER_KEY="$(openssl rand -hex 32)"
          php bin/pulsar list > /dev/null

      - name: Verify cache warmup pipeline
        # F28.4: do not bake a fixed master key into CI yaml. The
        # previous hardcoded `0123...cdef` value was 32 bytes of
        # entirely-public-knowledge entropy; cache artefacts encrypted
        # under it (uploaded by later steps) were trivially decryptable
        # by anyone reading the workflow file. Generate per-run instead
        # via openssl. The key is exported only inside this step and
        # is not persisted between jobs.
        run: |
          export PULSAR_MASTER_KEY="$(openssl rand -hex 32)"
          if php bin/pulsar list 2>/dev/null | grep -q 'optimize:validate'; then
            php bin/pulsar optimize:validate --strict
          else
            php bin/pulsar optimize
            php bin/pulsar optimize:clear
          fi

      - name: Lint localized route slugs (completeness + collisions)
        # Validates config/i18n.php localized_slugs: every key has a slug for
        # every supported locale and no per-locale slug collisions. Empty config
        # passes as a no-op; downstream projects inherit the same gate.
        run: |
          export PULSAR_MASTER_KEY="$(openssl rand -hex 32)"
          php bin/pulsar i18n:slugs:lint

  adr-check:
    name: ADR Governance Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base ref (fork-safe)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # F28.8: depth=1 only fetches the base SHA. The downstream
        # `check-adr.sh` does `git diff "${BASE_SHA}...HEAD"`, which
        # requires a reachable common ancestor — for PRs with multiple
        # commits this either fails with "fatal: object not in fetch"
        # or silently produces an incomplete diff. depth=50 fits the
        # typical PR-size cap (ADR-0031 hard cap is 1500 LOC) with
        # margin and keeps the fetch cheap.
        run: git fetch origin "$BASE_SHA" --depth=50

      - name: Check ADR governance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-adr.sh

  js:
    name: JS/TS (Lint, Format, Typecheck, Test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
