name: creusot

on:
  push:
    branches: [develop]
    paths:
      - 'crates/pulsar-kernel/**'
      - 'tools/scripts/install-creusot.sh'
      - '.github/workflows/creusot.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'crates/pulsar-kernel/**'
      - 'tools/scripts/install-creusot.sh'
      - '.github/workflows/creusot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # Smoke-test that pulsar-kernel builds with `creusot-std` linked in —
  # the kernel's regular dep on creusot-std (per ADR-0015) means every
  # build pulls the proc-macro crate; the `#[ensures]` / `#[requires]`
  # / `#[trusted]` attribute macros expand to no-ops on stable rustc
  # (full proof discharge requires the Creusot driver run via the
  # `proof-discharge` job below).
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check -p pulsar-kernel
        run: cargo check -p pulsar-kernel
        env:
          RUSTFLAGS: "-D warnings"

  # Proof-discharge job — installs the full Creusot toolchain (opam +
  # Why3 + Z3 + CVC5 + Creusot driver) and runs `cargo creusot prove`
  # on `pulsar-kernel`. Auto-triggered on every kernel-touching PR
  # since Phase 1.1.D.2.b: production-grade contracts on the hash
  # family exist and must hold for any change to that surface.
  proof-discharge:
    name: proof-discharge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Install apt prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq opam libzmq3-dev z3 cvc5

      - name: Cache opam switch
        uses: actions/cache@v4
        with:
          path: ~/.local/share/creusot/_opam
          key: creusot-opam-${{ runner.os }}-v0.11.0

      - name: Initialise opam (no sandboxing — runner is already isolated)
        run: |
          opam init --bare --disable-sandboxing -y --no-setup
          opam --cli=2.1 var --global in-creusot-ci=true

      - name: Install Creusot toolchain
        run: tools/scripts/install-creusot.sh

      - name: Discharge contracts
        # `cargo creusot prove` is the upstream subcommand for proof
        # discharge (verified against creusot-rs/creusot v0.11.0
        # cargo-creusot/src/main.rs:248). No feature flags needed —
        # creusot-std is a regular workspace dep so cargo-creusot's
        # version check (which reads `cargo metadata` without features)
        # finds it natively. Phase 1.1.D.2.a's `--features`-gated
        # approach was rejected per the empirical CI failure on
        # 2026-04-29 ("creusot-std not found in dependencies").
        run: |
          cd crates/pulsar-kernel
          cargo creusot prove
