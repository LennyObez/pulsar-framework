name: creusot

on:
  push:
    branches: [develop]
    paths:
      - 'crates/pulsar-kernel/**'
      - 'tools/scripts/install-creusot.sh'
      - '.github/workflows/creusot.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'crates/pulsar-kernel/**'
      - 'tools/scripts/install-creusot.sh'
      - '.github/workflows/creusot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  # Smoke-test that pulsar-kernel builds with `creusot-std` linked in —
  # the kernel's regular dep on creusot-std (per ADR-0015) means every
  # build pulls the proc-macro crate; the `#[ensures]` / `#[requires]`
  # / `#[trusted]` attribute macros expand to no-ops on stable rustc
  # (full proof discharge requires the Creusot driver run via the
  # `proof-discharge` job below).
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check -p pulsar-kernel
        run: cargo check -p pulsar-kernel
        env:
          RUSTFLAGS: "-D warnings"

  # Proof-discharge job — installs the full Creusot toolchain (opam +
  # Why3 + Z3 + CVC5 + Creusot driver) and runs `cargo creusot prove`
  # on `pulsar-kernel`.
  #
  # Trigger model: workflow_dispatch-only as of Phase 1.1.D.2.b-bis
  # (commit follow-up to 66f1b678). The 1.1.D.2.b auto-trigger flip
  # promised in 1.1.D.2.b's commit message had to be reverted twice:
  #
  # 1. Phase 1.1.D.2.b CI run 25308601251 (2026-05-04):
  #    "Unsupported constant value: Scalar(alloc) of type &[u8; 36]"
  #    on byte-string consts — fixed in 66f1b678 by migrating
  #    HYBRID_SIG_LABEL + HYBRID_SALT to &str.
  #
  # 2. Phase 1.1.D.2.b-bis CI run 25309936315 (2026-05-04):
  #    "Unsupported constant value: Scalar(alloc) of type &Once"
  #    — `std::sync::Once` is a sync primitive with internal mutability
  #    Creusot v0.11.0 doesn't model. Worked around by adding
  #    `#[creusot::no_translate]` on `ensure_initialized` (mod.rs).
  #
  # Each fix unveils the next Creusot v0.11 limitation. The realistic
  # path to "kernel-wide cargo creusot prove succeeds" requires either
  # (a) iterative bisection through every incompatible Rust idiom in
  # the kernel (multi-day investigation, unbounded scope), or (b)
  # Creusot upstream maturation (LazyLock / Once / complex consts). In
  # the meantime: contracts in hash.rs ARE the specification, the
  # `build` job validates compile-cleanness, and this job stays
  # workflow_dispatch-only so contributor PRs aren't gated on what is
  # effectively a moving target.
  #
  # Phase 1.1.E sprint exit gate revisits this — by then Creusot
  # v0.12+ may resolve several of the outstanding limitations.
  proof-discharge:
    name: proof-discharge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install apt prerequisites
        # `mold` + `clang` mirror cross-platform.yml — `cargo creusot prove`
        # runs a full `cargo build` (not `cargo check`), which invokes the
        # linker per .cargo/config.toml's `linker = "clang", -fuse-ld=mold`
        # x86_64-linux-gnu rustflags. The `build` job in this workflow uses
        # `cargo check` and so doesn't need them.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq opam libzmq3-dev z3 cvc5 mold clang

      - name: Cache opam switch
        uses: actions/cache@v4
        with:
          path: ~/.local/share/creusot/_opam
          key: creusot-opam-${{ runner.os }}-v0.11.0

      - name: Initialise opam (no sandboxing — runner is already isolated)
        run: |
          opam init --bare --disable-sandboxing -y --no-setup
          opam --cli=2.1 var --global in-creusot-ci=true

      - name: Install Creusot toolchain
        run: tools/scripts/install-creusot.sh

      - name: Discharge contracts
        # `cargo creusot prove` is the upstream subcommand for proof
        # discharge (verified against creusot-rs/creusot v0.11.0
        # cargo-creusot/src/main.rs:248). No feature flags needed —
        # creusot-std is a regular workspace dep so cargo-creusot's
        # version check (which reads `cargo metadata` without features)
        # finds it natively. Phase 1.1.D.2.a's `--features`-gated
        # approach was rejected per the empirical CI failure on
        # 2026-04-29 ("creusot-std not found in dependencies").
        run: |
          cd crates/pulsar-kernel
          cargo creusot prove
