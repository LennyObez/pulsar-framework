name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  php-audit:
    name: PHP Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version-file: .php-version
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Composer audit
        run: composer audit --format=json | tee audit-results.json

      # The inline version this replaces exited 0 when the report could not be
      # parsed, so an audit that failed to produce JSON read as "no
      # vulnerabilities". The script fails closed and separates the two outcomes.
      - name: Fail on ANY vulnerability advisory (zero-tolerance)
        run: composer security:audit

      # The root lockfile is not the whole dependency surface. Bundled extensions
      # ship their own manifest and no lockfile, so the audit above cannot see
      # what they require: extensions/auth alone declares league/oauth2-server,
      # web-auth/webauthn-lib and web-token/jwt-framework — the OAuth2, WebAuthn
      # and JWT implementations the framework ships for authentication — and none
      # of the three appears in composer.lock. Each manifest is resolved to a
      # throwaway lock here and audited against that.
      - name: Audit every extension manifest that requires third-party code
        run: |
          set -euo pipefail

          manifests=$(find extensions -name composer.json -not -path '*/vendor/*' | sort)

          if [ -z "$manifests" ]; then
            echo "::error::No extension manifest found under extensions/. Discovery is broken — an empty set is how this gate silently stops gating."
            exit 1
          fi

          audited=0

          while IFS= read -r manifest; do
            directory=$(dirname "$manifest")

            # Third-party is everything that is not the interpreter, a PHP
            # extension, or a sibling first-party package.
            requirements=$(jq -r '
              (.require // {})
              | keys[]
              | select(. != "php")
              | select(startswith("ext-") | not)
              | select(startswith("pulsar/") | not)
            ' "$manifest")

            if [ -z "$requirements" ]; then
              echo "$manifest — no third-party requirements"
              continue
            fi

            echo "::group::$manifest"
            echo "$requirements"

            # Auditing catches a vulnerable version; only Dependabot proposes a
            # newer one. A manifest monitored by one and not the other is the
            # blind spot this whole step exists to close, so the list in
            # dependabot.yml is checked rather than trusted.
            # Braces around the expansion: the `[` that opens the character class reads as
            # an array subscript otherwise, which shellcheck refuses (SC1087) and which
            # would silently change what this pattern matches.
            if ! grep -qE "^[[:space:]]*(directory: |- )/${directory}[[:space:]]*\$" .github/dependabot.yml; then
              echo "::error::$manifest requires third-party code, but /$directory has no entry in .github/dependabot.yml — nothing will ever propose an update for it."
              exit 1
            fi

            composer update --working-dir="$directory" --no-install --no-audit --no-interaction --no-progress
            composer audit --working-dir="$directory" --locked --format=json > "$directory/audit-results.json" || true
            php tools/ci/assert-no-advisories.php "$directory/audit-results.json"

            echo "::endgroup::"
            audited=$((audited + 1))
          done <<< "$manifests"

          echo "Audited $audited extension manifest(s) declaring third-party requirements."

      - name: Report abandoned packages
        run: |
          # Abandoned transitive dev-deps (e.g. doctrine/annotations pulled by phpbench)
          # are tolerated until upstream drops them. Direct abandoned deps MUST
          # still be replaced.
          composer audit --abandoned=report --no-interaction || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-results
          path: |
            audit-results.json
            extensions/**/audit-results.json
          retention-days: 30

  js-audit:
    name: JS Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # The zero-tolerance check is one PHP script for both ecosystems, so PHP is
      # set up here too. It parses a report; it needs no vendor/ tree.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version-file: .php-version
          coverage: none

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `|| true` covers pnpm's non-zero exit when it finds something, and nothing
      # else: the script below refuses to read a report pnpm failed to write.
      - name: Capture pnpm audit report
        run: pnpm audit --json > pnpm-audit-results.json || true

      # This step used to sum `jq '... // 0'` into a shell arithmetic expansion.
      # A failed audit left the capture empty, every jq call produced an empty
      # string, `$((...))` coerced them to 0, and the step reported a clean tree
      # for an audit that never ran — the exact defect the PHP half was rewritten
      # to remove, left standing twelve lines below the comment recording the fix.
      - name: Fail on ANY vulnerability advisory (zero-tolerance)
        run: php tools/ci/assert-no-advisories.php --ecosystem=pnpm pnpm-audit-results.json

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-dependency-audit-results
          path: pnpm-audit-results.json
          retention-days: 30
