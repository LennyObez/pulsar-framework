name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  php-audit:
    name: PHP Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Composer audit
        run: composer audit --format=json | tee audit-results.json

      - name: Check for critical/high vulnerabilities
        run: |
          if php -r '
            $json = file_get_contents("audit-results.json");
            $data = json_decode($json, true);
            if (!is_array($data)) { exit(0); }
            $advisories = $data["advisories"] ?? [];
            $critical = 0;
            foreach ($advisories as $package => $issues) {
              foreach ($issues as $issue) {
                $severity = strtolower($issue["severity"] ?? "unknown");
                if (in_array($severity, ["critical", "high"], true)) {
                  echo "CRITICAL/HIGH: {$package} — {$issue["title"]}\n";
                  $critical++;
                }
              }
            }
            exit($critical > 0 ? 1 : 0);
          '; then
            echo "No critical or high severity vulnerabilities found."
          else
            echo "::error::Critical or high severity vulnerabilities detected. See audit output above."
            exit 1
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-results
          path: audit-results.json
          retention-days: 30

  js-audit:
    name: JS Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high || true

      - name: Check for critical vulnerabilities
        run: |
          RESULT=$(pnpm audit --json 2>/dev/null || true)
          CRITICAL=$(echo "$RESULT" | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
          HIGH=$(echo "$RESULT" | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical and $HIGH high severity JS vulnerabilities."
            exit 1
          fi

          echo "No critical or high severity JS vulnerabilities found."
