name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  php-audit:
    name: PHP Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Composer audit
        run: composer audit --format=json | tee audit-results.json

      - name: Fail on ANY vulnerability advisory (zero-tolerance)
        run: |
          if php -r '
            $json = file_get_contents("audit-results.json");
            $data = json_decode($json, true);
            if (!is_array($data)) { exit(0); }
            $advisories = $data["advisories"] ?? [];
            $total = 0;
            foreach ($advisories as $package => $issues) {
              foreach ($issues as $issue) {
                $severity = strtoupper($issue["severity"] ?? "UNKNOWN");
                $title = $issue["title"] ?? "(no title)";
                $cve = $issue["cve"] ?? "(no CVE)";
                echo "{$severity}: {$package} — {$cve} — {$title}\n";
                $total++;
              }
            }
            exit($total > 0 ? 1 : 0);
          '; then
            echo "No vulnerability advisories found (any severity)."
          else
            echo "::error::One or more vulnerability advisories detected. Zero-tolerance policy: all severities fail the build."
            exit 1
          fi

      - name: Report abandoned packages (tracked in tech-debt.md)
        run: |
          # Abandoned transitive dev-deps (e.g. doctrine/annotations pulled by phpbench)
          # are tracked in .claude/design/framework-uncompromising/tech-debt.md until
          # upstream drops them. Direct abandoned deps MUST still be replaced.
          composer audit --abandoned=report --no-interaction || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-results
          path: audit-results.json
          retention-days: 30

  js-audit:
    name: JS Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=info || true

      - name: Fail on ANY vulnerability advisory (zero-tolerance)
        run: |
          RESULT=$(pnpm audit --json 2>/dev/null || true)
          CRITICAL=$(echo "$RESULT" | jq '.metadata.vulnerabilities.critical // 0' 2>/dev/null || echo "0")
          HIGH=$(echo "$RESULT" | jq '.metadata.vulnerabilities.high // 0' 2>/dev/null || echo "0")
          MODERATE=$(echo "$RESULT" | jq '.metadata.vulnerabilities.moderate // 0' 2>/dev/null || echo "0")
          LOW=$(echo "$RESULT" | jq '.metadata.vulnerabilities.low // 0' 2>/dev/null || echo "0")
          INFO=$(echo "$RESULT" | jq '.metadata.vulnerabilities.info // 0' 2>/dev/null || echo "0")
          TOTAL=$((CRITICAL + HIGH + MODERATE + LOW + INFO))

          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::Found $TOTAL JS vulnerabilities (critical=$CRITICAL high=$HIGH moderate=$MODERATE low=$LOW info=$INFO). Zero-tolerance policy: all severities fail the build."
            exit 1
          fi

          echo "No JS vulnerability advisories found (any severity)."
