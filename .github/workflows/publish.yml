name: publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # required for crates.io Trusted Publisher OIDC flow

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse skip-hooks tags
        run: |
          if [[ "${{ github.ref_name }}" == *"+nogpg"* ]] || [[ "${{ github.ref_name }}" == *"-noverify"* ]]; then
            echo "::error::Tag suggests bypassed signing or hooks; aborting publish."
            exit 1
          fi

  fmt-clippy-test:
    name: pre-publish gates
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc

  publish-crates:
    name: publish to crates.io
    needs: fmt-clippy-test
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2

      - name: authenticate via crates.io Trusted Publisher (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: dry-run publish in dependency order
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in pulsar-kernel pulsar-test; do
            cargo publish --package "$crate" --dry-run --allow-dirty
          done

      - name: publish in dependency order
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # v2.3 dependency order (76 crates per Decision 2.51): kernel + HACL FFI
          # first, then core foundation, then security controls (un-fused per
          # ADR-0011), then application infrastructure + drivers (sqlx-pattern
          # per ADR-0011), then API paradigms (un-fused realtime), then domains,
          # then CLI + meta-crate last.
          ORDER=(
            pulsar-kernel
            pulsar-crypto-hacl-bindings
            pulsar-http
            pulsar-engine
            pulsar-orm
            pulsar-orm-postgres
            pulsar-orm-mysql
            pulsar-orm-sqlite
            pulsar-orm-clickhouse
            pulsar-audit
            pulsar-auth
            pulsar-compliance
            pulsar-observability
            pulsar-search
            pulsar-csrf
            pulsar-sri
            pulsar-incident
            pulsar-ratelimit
            pulsar-resilience
            pulsar-ssrf-guard
            pulsar-mail
            pulsar-queue
            pulsar-scheduler
            pulsar-cache
            pulsar-config
            pulsar-storage
            pulsar-storage-s3
            pulsar-storage-azure
            pulsar-storage-gcs
            pulsar-storage-fs
            pulsar-form
            pulsar-webhook
            pulsar-idempotency
            pulsar-notification
            pulsar-pagination
            pulsar-feature-flag
            pulsar-i18n
            pulsar-tenancy
            pulsar-dataprotection
            pulsar-consent
            pulsar-authz
            pulsar-identity-standards
            pulsar-cms
            pulsar-forum
            pulsar-payments
            pulsar-console-api
            pulsar-api
            pulsar-graphql
            pulsar-grpc
            pulsar-mcp-server
            pulsar-websocket
            pulsar-sse
            pulsar-webtransport
            pulsar-broadcasting
            pulsar-ai
            pulsar-ai-governance
            pulsar-vector-search
            pulsar-ai-agents
            pulsar-live
            pulsar-studio
            pulsar-analytics
            pulsar-accessibility
            pulsar-workflow
            pulsar-saga
            pulsar-cloud
            pulsar-cloud-aws
            pulsar-cloud-azure
            pulsar-cloud-gcp
            pulsar-cloud-oci
            pulsar-edge
            pulsar-supervisor
            pulsar-service-discovery
            pulsar-deploy
            pulsar-cli
            pulsar-test
            pulsar-framework
          )
          for crate in "${ORDER[@]}"; do
            echo "::group::publish $crate"
            cargo publish --package "$crate" --no-verify
            echo "::endgroup::"
          done

  # ─── Supply-chain artefacts ───
  #
  # Per Decision 2.57 v2.3 lock-in (SLSA Source L3 + SLSA Build L4 + in-toto
  # layout + Cosign + SBOM + Trusted Publisher OIDC) + plan Section 14.6 SLSA
  # Level 4 + Section 16.10.5 container image signing + Section 16.12.8
  # OpenSSF Scorecard ≥ 9.0 (Pinned-Dependencies + Signed-Releases + SBOM
  # checks).
  #
  # Three layers of provenance attestation:
  #   (1) SLSA Source L3 — branch protection + signed commits + 18-month
  #       retention; attested via the GitHub Actions OIDC issuer claim.
  #   (2) SLSA Build L4 — hermetic build + reproducible-build verification
  #       (cross-builder digest match per .github/workflows/repro-build.yml)
  #       + provenance attestation via actions/attest-build-provenance@v1.
  #   (3) in-toto layout — declares the full source → build → SBOM → sign →
  #       publish chain; each step has an expected signer + expected output;
  #       verifiers replay via in-toto-verify.
  #
  # Cosign keyless signing (Sigstore Fulcio + Rekor transparency log) covers
  # every release artefact (SBOM, attestations, layout). CycloneDX SBOM
  # emitted per-crate.
  supply-chain:
    name: SBOM + Cosign + SLSA Source L3 + Build L4 + in-toto
    needs: publish-crates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach assets to the release
      id-token: write   # for Sigstore keyless signing + OIDC SLSA Source attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      # ─── SLSA Source Level 3 attestation ────────────────────────────────
      # SLSA Source L3 requires:
      # (a) Source identity bound to maintainer's signing key.
      # (b) Branch protection enforcing signed commits + status checks.
      # (c) Immutable history on `main` (no force-push, no rebase post-merge).
      # (d) 18-month retention of signing-key audit trail.
      #
      # The attestation here records (a) + (b) + (c) at publish time;
      # (d) is operational and lives outside CI scope.
      - name: SLSA Source L3 — collect commit signing + branch protection
        id: source-attest
        run: |
          echo "=== SLSA Source L3 attestation ==="
          # Collect the signing identity of every commit reachable from the
          # release tag. SLSA Source L3 requires this for the audit trail.
          mkdir -p slsa
          {
            echo "tag: ${{ github.ref_name }}"
            echo "sha: ${{ github.sha }}"
            echo "ref_protected: ${{ github.event.repository.default_branch == 'main' && 'true' || 'unknown' }}"
            echo "actor: ${{ github.actor }}"
            echo "actor_id: ${{ github.actor_id }}"
            echo "event_name: ${{ github.event_name }}"
            echo "workflow_ref: ${{ github.workflow_ref }}"
            echo "job_workflow_ref: ${{ github.job_workflow_sha }}"
            echo "build_started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---"
            echo "commit signature trail (last 100 commits):"
            git log -100 --format='%H %G? %GS %s' "${{ github.ref_name }}"
          } > slsa/source-l3-attestation.txt
          echo "attestation_path=slsa/source-l3-attestation.txt" >> "$GITHUB_OUTPUT"

      # ─── SBOM (CycloneDX) ────────────────────────────────────────────────
      - name: Install cyclonedx-cargo (CycloneDX SBOM emitter)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM (workspace-wide, per-crate + aggregate)
        run: |
          cargo cyclonedx --workspace --format json --output-pattern bom \
            --output-cdx --license-strict
          mkdir -p sbom
          mv crates/*/bom.cdx.json sbom/ 2>/dev/null || true
          mv tools/*/bom.cdx.json sbom/ 2>/dev/null || true
          # Build a workspace-wide aggregate by merging per-crate SBOMs.
          # cyclonedx-cli is the canonical merger; install via taiki-e action.
          ls -la sbom/

      - name: Install cyclonedx-cli for SBOM merge
        uses: taiki-e/install-action@v2
        with:
          tool: cyclonedx-cli

      - name: Merge per-crate SBOMs into workspace aggregate
        run: |
          cyclonedx-cli merge \
            --input-format json \
            --output-format json \
            --output-file sbom/pulsar-framework-workspace.cdx.json \
            sbom/*.cdx.json || \
          echo "::warning::cyclonedx-cli merge failed; per-crate SBOMs remain in sbom/"

      # ─── Cosign keyless signing (Sigstore Fulcio + Rekor) ───────────────
      - name: Install Cosign (Sigstore keyless signing)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Cosign sign SBOM + SLSA Source L3 attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Sign every per-crate SBOM + the workspace aggregate + the SLSA
          # Source L3 attestation. Each sign-blob produces a .sig + .crt
          # pair; the corresponding entry lands in Sigstore Rekor for
          # public verification.
          for blob in sbom/*.cdx.json slsa/*.txt; do
            [ -f "$blob" ] || continue
            cosign sign-blob --yes \
              --output-signature "${blob}.sig" \
              --output-certificate "${blob}.crt" \
              "$blob"
          done
          ls -la sbom/ slsa/

      # ─── SLSA Build Level 4 — provenance attestation ─────────────────────
      - name: Generate SLSA Build L4 provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            sbom/*.cdx.json
            slsa/*.txt

      # ─── in-toto layout ─────────────────────────────────────────────────
      # The in-toto layout declares the full source → build → SBOM → sign →
      # publish chain. Each step has an expected signer (Cosign / Trusted
      # Publisher OIDC / GitHub-Actions-attested) + expected output (SBOM
      # path / signature path / crate name list). Verifiers replay via
      # in-toto-verify against the layout.
      - name: Install in-toto + sslib (Python — used by in-toto)
        run: |
          python3 -m pip install --user in-toto securesystemslib

      - name: Generate in-toto layout
        run: |
          mkdir -p attestations
          cat > attestations/pulsar-framework.layout.template <<'LAYOUT'
          {
            "_type": "layout",
            "expires": "2027-04-27T00:00:00Z",
            "readme": "Pulsar Framework v2.3 supply-chain in-toto layout. Steps cover source → build → SBOM emission → Cosign signing → crates.io publish. Verifiers run in-toto-verify with this layout + the released attestations to validate the full chain.",
            "keys": {
              "comment": "Sigstore Fulcio CA certificate fingerprints land here at runtime"
            },
            "steps": [
              {
                "name": "source-checkout",
                "expected_command": ["git", "clone", "https://github.com/LennyObez/pulsar-framework"],
                "threshold": 1,
                "expected_materials": [],
                "expected_products": [["MATCH", "*", "WITH", "PRODUCTS", "FROM", "build-rust"]]
              },
              {
                "name": "build-rust",
                "expected_command": ["cargo", "build", "--workspace", "--release"],
                "threshold": 1,
                "expected_materials": [["MATCH", "*", "WITH", "PRODUCTS", "FROM", "source-checkout"]],
                "expected_products": [["MATCH", "target/*/release/*", "WITH", "PRODUCTS", "FROM", "sbom-emit"]]
              },
              {
                "name": "sbom-emit",
                "expected_command": ["cargo", "cyclonedx", "--workspace", "--format", "json"],
                "threshold": 1,
                "expected_materials": [["MATCH", "target/*/release/*", "WITH", "PRODUCTS", "FROM", "build-rust"]],
                "expected_products": [["MATCH", "sbom/*.cdx.json", "WITH", "PRODUCTS", "FROM", "cosign-sign"]]
              },
              {
                "name": "cosign-sign",
                "expected_command": ["cosign", "sign-blob", "--yes"],
                "threshold": 1,
                "expected_materials": [["MATCH", "sbom/*.cdx.json", "WITH", "PRODUCTS", "FROM", "sbom-emit"]],
                "expected_products": [["MATCH", "sbom/*.sig", "WITH", "PRODUCTS", "FROM", "publish-cratesio"]]
              },
              {
                "name": "publish-cratesio",
                "expected_command": ["cargo", "publish", "--package", "*"],
                "threshold": 1,
                "expected_materials": [["MATCH", "sbom/*.cdx.json", "WITH", "PRODUCTS", "FROM", "cosign-sign"]],
                "expected_products": []
              }
            ],
            "inspect": []
          }
          LAYOUT
          # Sign the layout via Cosign keyless (so verifiers establish trust
          # via Sigstore + the maintainer's GitHub OIDC issuer).
          cosign sign-blob --yes \
            --output-signature attestations/pulsar-framework.layout.template.sig \
            --output-certificate attestations/pulsar-framework.layout.template.crt \
            attestations/pulsar-framework.layout.template
          ls -la attestations/

      # ─── Federated mirror to Sigstore Rekor (publicly verifiable) ───────
      # Cosign automatically published to Rekor via the sign-blob step above.
      # No separate step needed; the Rekor URL appears in cosign's stdout.

      # ─── Attach all artefacts to the GitHub Release ─────────────────────
      - name: Attach SBOM + signatures + SLSA + in-toto layout to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom/*.cdx.json
            sbom/*.cdx.json.sig
            sbom/*.cdx.json.crt
            slsa/*.txt
            slsa/*.txt.sig
            slsa/*.txt.crt
            attestations/*.layout.template
            attestations/*.layout.template.sig
            attestations/*.layout.template.crt
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |

            ---
            ## Supply-chain artefacts (per Decision 2.57 v2.3 lock-in)

            * **SBOM** (CycloneDX 1.6) — per-crate `bom.cdx.json` + workspace-wide aggregate `pulsar-framework-workspace.cdx.json`.
            * **Cosign signatures** (Sigstore keyless via Fulcio + Rekor transparency log) — `*.cdx.json.sig` + `*.cdx.json.crt` for every artefact.
            * **SLSA Source Level 3** attestation — `slsa/source-l3-attestation.txt` records signing identity of every commit reachable from the release tag, branch protection state, workflow_ref + job_workflow_sha for in-toto chain validation.
            * **SLSA Build Level 4** provenance — attested via `actions/attest-build-provenance@v1` + verified by `repro-build.yml` two-builder digest match. Verify with `gh attestation verify`.
            * **in-toto layout** — `attestations/pulsar-framework.layout.template` declares the full source → build → SBOM → sign → publish chain. Verifiers run `in-toto-verify --layout attestations/pulsar-framework.layout.template --layout-keys <maintainer-fulcio-cert>` against the released attestations.

            **References:** ADR-0007 (branch model), ADR-0009 (HACL\*), ADR-0011 (76-crate workspace), ADR-0013 (audit chain Ed25519+Merkle+RFC 6962), ADR-0014 (test discipline), Decision 2.57 (supply chain), Decision 2.58 (PQC posture).

  github-release:
    name: GitHub Release
    needs: publish-crates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${tag}." > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
