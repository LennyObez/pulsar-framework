name: publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # required for crates.io Trusted Publisher OIDC flow

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse skip-hooks tags
        run: |
          if [[ "${{ github.ref_name }}" == *"+nogpg"* ]] || [[ "${{ github.ref_name }}" == *"-noverify"* ]]; then
            echo "::error::Tag suggests bypassed signing or hooks; aborting publish."
            exit 1
          fi

  fmt-clippy-test:
    name: pre-publish gates
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc

  publish-crates:
    name: publish to crates.io
    needs: fmt-clippy-test
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2

      - name: authenticate via crates.io Trusted Publisher (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: dry-run publish in dependency order
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in pulsar-kernel pulsar-test; do
            cargo publish --package "$crate" --dry-run --allow-dirty
          done

      - name: publish in dependency order
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Dependency order from kernel outward; later phases extend the list as crates stabilise.
          ORDER=(
            pulsar-kernel
            pulsar-http
            pulsar-engine
            pulsar-orm
            pulsar-audit
            pulsar-auth
            pulsar-compliance
            pulsar-observability
            pulsar-search
            pulsar-guard
            pulsar-mail
            pulsar-queue
            pulsar-scheduler
            pulsar-cache
            pulsar-config
            pulsar-storage
            pulsar-form
            pulsar-webhook
            pulsar-idempotency
            pulsar-notification
            pulsar-pagination
            pulsar-feature-flag
            pulsar-i18n
            pulsar-tenancy
            pulsar-dataprotection
            pulsar-consent
            pulsar-authz
            pulsar-identity-standards
            pulsar-cms
            pulsar-forum
            pulsar-payments
            pulsar-console-api
            pulsar-api
            pulsar-graphql
            pulsar-grpc
            pulsar-mcp-server
            pulsar-realtime
            pulsar-ai
            pulsar-ai-governance
            pulsar-vector-search
            pulsar-ai-agents
            pulsar-live
            pulsar-studio
            pulsar-analytics
            pulsar-accessibility
            pulsar-orchestration
            pulsar-cloud
            pulsar-edge
            pulsar-cluster
            pulsar-deploy
            pulsar-cli
            pulsar-test
            pulsar-framework
          )
          for crate in "${ORDER[@]}"; do
            echo "::group::publish $crate"
            cargo publish --package "$crate" --no-verify
            echo "::endgroup::"
          done

  # ─── Supply-chain artefacts (SBOM + SLSA provenance + Cosign signatures) ───
  # Per plan Section 14.6 SLSA Level 4 + Section 16.10.5 container image signing
  # + Section 16.12.8 OpenSSF Scorecard ≥ 9.0 (Pinned-Dependencies + Signed-
  # Releases + SBOM checks). Generates a CycloneDX SBOM, signs every release
  # artefact via Cosign keyless signing (Sigstore Fulcio), and publishes
  # signatures + transparency-log entries to Rekor.
  supply-chain:
    name: SBOM + Cosign + SLSA provenance
    needs: publish-crates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to attach assets to the release
      id-token: write   # for Sigstore keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Install cyclonedx-cargo (CycloneDX SBOM emitter)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOM (workspace-wide)
        run: |
          cargo cyclonedx --workspace --format json --output-pattern bom \
            --output-cdx --license-strict
          # Emits per-crate bom.cdx.json files; consolidate into a single
          # workspace SBOM.
          mkdir -p sbom
          mv crates/*/bom.cdx.json sbom/ 2>/dev/null || true
          mv tools/*/bom.cdx.json sbom/ 2>/dev/null || true
          ls -la sbom/

      - name: Install Cosign (Sigstore keyless signing)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Cosign sign SBOM (Sigstore keyless via Fulcio + Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          for sbom in sbom/*.cdx.json; do
            cosign sign-blob --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.crt" \
              "$sbom"
          done
          ls -la sbom/

      - name: Generate SLSA Level 3 provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            sbom/*.cdx.json

      - name: Attach SBOM + signatures to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom/*.cdx.json
            sbom/*.cdx.json.sig
            sbom/*.cdx.json.crt
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |

            ---
            ## Supply-chain artefacts

            * **SBOM** (CycloneDX 1.6) — per-crate `bom.cdx.json` + workspace-wide aggregate.
            * **Cosign signatures** (Sigstore keyless via Fulcio + Rekor transparency log) — `*.cdx.json.sig` + `*.cdx.json.crt`.
            * **SLSA Level 3 build provenance** — attested via `actions/attest-build-provenance@v1`. Verify with `gh attestation verify`.

            Per plan Section 14.6 SLSA Level 4 + Section 16.10.5 + Section 16.12.8 (OpenSSF Scorecard target ≥ 9.0).

  github-release:
    name: GitHub Release
    needs: publish-crates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${tag}." > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
