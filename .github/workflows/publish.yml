name: publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (do not publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # required for crates.io Trusted Publisher OIDC flow

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse skip-hooks tags
        run: |
          if [[ "${{ github.ref_name }}" == *"+nogpg"* ]] || [[ "${{ github.ref_name }}" == *"-noverify"* ]]; then
            echo "::error::Tag suggests bypassed signing or hooks; aborting publish."
            exit 1
          fi

  fmt-clippy-test:
    name: pre-publish gates
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc

  publish-crates:
    name: publish to crates.io
    needs: fmt-clippy-test
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2

      - name: authenticate via crates.io Trusted Publisher (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: dry-run publish in dependency order
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in pulsar-kernel pulsar-test; do
            cargo publish --package "$crate" --dry-run --allow-dirty
          done

      - name: publish in dependency order
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Dependency order from kernel outward; later phases extend the list as crates stabilise.
          ORDER=(
            pulsar-kernel
            pulsar-http
            pulsar-engine
            pulsar-orm
            pulsar-audit
            pulsar-auth
            pulsar-compliance
            pulsar-observability
            pulsar-search
            pulsar-guard
            pulsar-mail
            pulsar-queue
            pulsar-scheduler
            pulsar-cache
            pulsar-config
            pulsar-storage
            pulsar-form
            pulsar-webhook
            pulsar-idempotency
            pulsar-notification
            pulsar-pagination
            pulsar-feature-flag
            pulsar-i18n
            pulsar-tenancy
            pulsar-dataprotection
            pulsar-consent
            pulsar-authz
            pulsar-identity-standards
            pulsar-cms
            pulsar-forum
            pulsar-payments
            pulsar-console-api
            pulsar-api
            pulsar-graphql
            pulsar-grpc
            pulsar-mcp-server
            pulsar-realtime
            pulsar-ai
            pulsar-ai-governance
            pulsar-vector-search
            pulsar-ai-agents
            pulsar-live
            pulsar-studio
            pulsar-analytics
            pulsar-accessibility
            pulsar-orchestration
            pulsar-cloud
            pulsar-edge
            pulsar-cluster
            pulsar-deploy
            pulsar-cli
            pulsar-test
            pulsar-framework
          )
          for crate in "${ORDER[@]}"; do
            echo "::group::publish $crate"
            cargo publish --package "$crate" --no-verify
            echo "::endgroup::"
          done

  github-release:
    name: GitHub Release
    needs: publish-crates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: extract release notes from CHANGELOG
        id: notes
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${tag}." > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
