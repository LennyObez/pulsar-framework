[workspace.package]
version = "0.0.1-alpha.0"
authors = ["Lenny Obez <github@lennyobez.com>"]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/LennyObez/pulsar-framework"
homepage = "https://pulsar-framework.com"
documentation = "https://docs.rs/pulsar-framework"
readme = "README.md"
keywords = ["web", "framework", "regulated", "banking", "healthcare"]
categories = ["web-programming::http-server", "web-programming"]

# ──────────────────────────────────────────────────────────────────────────
# Workspace-level lints (Cargo 1.74+ unified lint policy per Section XVII).
# Per-crate `lib.rs` opts into these via `[lints] workspace = true`. Overrides
# for crates that need exceptions (e.g. proc-macro crates) are per-crate.
# ──────────────────────────────────────────────────────────────────────────
[workspace.lints.rust]
# Safety: Section XVII.23 unsafe-code policy
unsafe_code = "forbid"
# Documentation: Section XVII.21 every public item documented
missing_docs = "deny"
# Soundness: idiomatic Rust 2024 hygiene. Lint group → explicit priority below
# the individual lints in this section so per-lint overrides take precedence.
rust_2024_compatibility = { level = "deny", priority = -1 }
unused_must_use = "deny"
unused_lifetimes = "warn"
unused_imports = "warn"
unused_extern_crates = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Pedantic + nursery + cargo lints; project-specific allows below
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Section XVII.7 error strategy: forbid panics in library code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# Section XVII.5 method naming
get_unwrap = "deny"
# Allow legitimate cases that pedantic flags noisily
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"  # see deny.toml multiple-versions = "warn" instead

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "deny"

[workspace.dependencies]
# ──────────────────────────────────────────────────────────────────────────
# Async runtime
# ──────────────────────────────────────────────────────────────────────────
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# ──────────────────────────────────────────────────────────────────────────
# HTTP stack
# ──────────────────────────────────────────────────────────────────────────
hyper = { version = "1.9", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# ──────────────────────────────────────────────────────────────────────────
# Crypto primitives — multi-source verification stack per Decision 2.60
#   - HACL* via FFI (`pulsar-crypto-hacl-bindings`) for the 12 classical primitives
#   - libcrux Rust-native for the 4 NIST PQC primitives (ML-KEM, ML-DSA)
#   - RustCrypto `argon2` for password hashing (audited, not formally verified)
#   - `ring` + `subtle` retained at workspace level for legacy-compat AEADs +
#     constant-time byte equality re-export. Direct kernel use is replaced by
#     `pulsar-crypto-hacl-bindings` per ADR-0009 + Decision 2.53.
# ──────────────────────────────────────────────────────────────────────────
ring = "0.17"
rustls = "0.23"
rustls-pemfile = "2.2"
argon2 = "0.5"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
rand = "0.8"
rand_chacha = "0.3"
blake3 = "1.8"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"

# PQC — Cryspen libcrux Rust-native verified primitives per Decision 2.60.
# hax + F* verification of field arithmetic, NTT polynomial arithmetic,
# serialization, and high-level algorithm composition. FIPS 203 / 204
# conformance. Pure Rust → no FFI burden. Per-crate independent release
# cadence at Cryspen — pin the latest published patch each (ml-kem at
# 0.0.8, ml-dsa at 0.0.6 as of 2026Q2; bump together at Sprint 1.1.C
# integration if Cryspen ships compatible newer patches).
libcrux-ml-kem = "0.0.8"
libcrux-ml-dsa = "0.0.6"

# ──────────────────────────────────────────────────────────────────────────
# Serialization
# ──────────────────────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
rmp-serde = "1.3"
ciborium = "0.2"

# ──────────────────────────────────────────────────────────────────────────
# Database
# ──────────────────────────────────────────────────────────────────────────
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "mysql", "chrono", "uuid", "json", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }

# ──────────────────────────────────────────────────────────────────────────
# Search
# ──────────────────────────────────────────────────────────────────────────
tantivy = "0.25"

# ──────────────────────────────────────────────────────────────────────────
# Observability (OpenTelemetry semantic conventions compliance)
# ──────────────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry-semantic-conventions = "0.31"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
clickhouse = "0.13"

# ──────────────────────────────────────────────────────────────────────────
# Auth + Identity standards
# ──────────────────────────────────────────────────────────────────────────
oauth2 = "5"
openidconnect = "4"
webauthn-rs = "0.5"
totp-rs = "5"
samael = "0.0.18"  # SAML 2.0
ldap3 = "0.11"
cryptoki = "0.7"   # PKCS#11 HSM

# ──────────────────────────────────────────────────────────────────────────
# Template engine + i18n
# ──────────────────────────────────────────────────────────────────────────
pest = "2"
pest_derive = "2"
icu = "2.2"
unic-langid = "0.9"

# ──────────────────────────────────────────────────────────────────────────
# Mail
# ──────────────────────────────────────────────────────────────────────────
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
mrml = "4"

# ──────────────────────────────────────────────────────────────────────────
# Storage
# ──────────────────────────────────────────────────────────────────────────
object_store = { version = "0.11", features = ["aws", "azure", "gcp"] }

# ──────────────────────────────────────────────────────────────────────────
# Realtime / WebSocket / Broadcasting
# Per Section IV 4.38 pulsar-realtime spec: WebSocket via tokio-tungstenite,
# pub/sub backends Redis (in `redis = ...` section), NATS (async-nats from
# Synadia, the official client of the CNCF Graduated NATS messaging system),
# Kafka (rdkafka, the canonical Rust wrapper around Confluent's librdkafka).
# Both async-nats and rdkafka are production-grade, widely deployed
# (async-nats: Walmart, Mastercard, Tesla; rdkafka: Apache Pinot, Materialize).
# ──────────────────────────────────────────────────────────────────────────
tokio-tungstenite = "0.24"
async-nats = "0.47"
rdkafka = "0.39"

# ──────────────────────────────────────────────────────────────────────────
# API paradigms
# ──────────────────────────────────────────────────────────────────────────
async-graphql = "7"
tonic = "0.13"
tonic-build = "0.13"
prost = "0.13"
utoipa = "5"

# ──────────────────────────────────────────────────────────────────────────
# AI / ML (Rust-native, no Python sidecar)
# ──────────────────────────────────────────────────────────────────────────
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
qdrant-client = "1.11"

# ──────────────────────────────────────────────────────────────────────────
# WASM extension sandbox
# ──────────────────────────────────────────────────────────────────────────
wasmtime = "44"
wasmtime-wasi = "44"

# ──────────────────────────────────────────────────────────────────────────
# Form + Validation + MIME
# ──────────────────────────────────────────────────────────────────────────
validator = "0.19"
infer = "0.16"

# ──────────────────────────────────────────────────────────────────────────
# Cache (multi-tier)
# ──────────────────────────────────────────────────────────────────────────
moka = { version = "0.12", features = ["future"] }

# ──────────────────────────────────────────────────────────────────────────
# Scheduler
# ──────────────────────────────────────────────────────────────────────────
cron = "0.12"

# ──────────────────────────────────────────────────────────────────────────
# Configuration
# ──────────────────────────────────────────────────────────────────────────
figment = { version = "0.10", features = ["toml", "env"] }

# ──────────────────────────────────────────────────────────────────────────
# Service discovery
# ──────────────────────────────────────────────────────────────────────────
etcd-client = "0.14"
hickory-resolver = "0.24"
k8s-openapi = { version = "0.24", features = ["latest"] }

# ──────────────────────────────────────────────────────────────────────────
# Cloud SDKs (AWS, Azure, GCP) — for pulsar-cloud
# ──────────────────────────────────────────────────────────────────────────
aws-sdk-s3 = "1.56"
aws-config = "1.5"  # v2.3 — required by pulsar-cloud-aws + pulsar-storage-s3 driver crates per Decision 2.51
azure_core = "0.21"
google-cloud-storage = "0.22"

# ──────────────────────────────────────────────────────────────────────────
# Edge / ACME (instant-acme: modern async ACME v2 client on hyper + rustls,
# no native-tls dependency, replaces the abandoned acme-client 0.4)
# ──────────────────────────────────────────────────────────────────────────
instant-acme = "0.8"

# ──────────────────────────────────────────────────────────────────────────
# Feature flags (OpenFeature-compatible)
# ──────────────────────────────────────────────────────────────────────────
open-feature = "0.1"

# ──────────────────────────────────────────────────────────────────────────
# Error handling
# ──────────────────────────────────────────────────────────────────────────
thiserror = "2.0"
anyhow = "1.0"

# ──────────────────────────────────────────────────────────────────────────
# Utilities
# ──────────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
url = "2.5"
bytes = "1.9"
regex = "1.11"
percent-encoding = "2.3"
once_cell = "1.20"
parking_lot = "0.12"
dashmap = "6.1"
rust_decimal = { version = "1.36", features = ["serde"] }

# ──────────────────────────────────────────────────────────────────────────
# CLI
# ──────────────────────────────────────────────────────────────────────────
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"
console = "0.15"

# ──────────────────────────────────────────────────────────────────────────
# Import / Export formats
# ──────────────────────────────────────────────────────────────────────────
calamine = "0.26"  # Excel
polars = { version = "0.45", features = ["parquet", "csv", "json"] }

# ──────────────────────────────────────────────────────────────────────────
# Proc-macro support (for ORM, engine, kernel attributes)
# ──────────────────────────────────────────────────────────────────────────
proc-macro2 = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
darling = "0.21"

# ──────────────────────────────────────────────────────────────────────────
# Testing
# ──────────────────────────────────────────────────────────────────────────
proptest = "1.6"
quickcheck = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
mockall = "0.13"
insta = { version = "1.42", features = ["json", "yaml"] }
wiremock = "0.6"
scraper = "0.20"
thirtyfour = "0.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = "full"
strip = "none"

[profile.bench]
opt-level = 3
lto = "thin"
debug = "line-tables-only"

[profile.dev]
opt-level = 0
debug = "full"
incremental = true

[profile.dev.package."*"]
# Dependencies compiled in opt-level=1 for faster debug runs
opt-level = 1
