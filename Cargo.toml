[workspace]
resolver = "3"
# v2.3 architecture: 76 first-party Rust crates (per Decision 2.51).
# Net change vs v2.2 (53 crates):
#   - 4 meta-crates removed (pulsar-guard, pulsar-realtime,
#     pulsar-orchestration, pulsar-cluster — per Decision 2.51 dé-fusion)
#   - 14 sub-module crates added (csrf + sri + incident + ratelimit +
#     resilience + ssrf-guard ; websocket + sse + webtransport +
#     broadcasting ; workflow + saga ; supervisor + service-discovery)
#   - 12 driver crates added (orm-postgres/mysql/sqlite/clickhouse ;
#     cloud-aws/azure/gcp/oci ; storage-s3/azure/gcs/fs)
#   - 1 HACL* FFI binding crate added (pulsar-crypto-hacl-bindings —
#     *-sys-style; safe Rust wrappers + Creusot contracts live in
#     pulsar-kernel per ADR-0009 + Decision 2.53)
# Total: 53 - 4 + 14 + 12 + 1 = 76 crates.
members = [
    # ─────────────────────────────────────────────────────────────────────
    # Meta-crate (re-exports stable public surface)
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-framework",

    # ─────────────────────────────────────────────────────────────────────
    # Kernel layer — formally verified, minimum surface
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-kernel",
    "crates/pulsar-crypto-hacl-bindings",  # v2.3 *-sys FFI to HACL* per Decision 2.53

    # ─────────────────────────────────────────────────────────────────────
    # Core foundation crates
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-http",
    "crates/pulsar-engine",
    "crates/pulsar-orm",
    "crates/pulsar-orm-postgres",          # v2.3 sqlx-pattern driver
    "crates/pulsar-orm-mysql",             # v2.3 sqlx-pattern driver
    "crates/pulsar-orm-sqlite",            # v2.3 sqlx-pattern driver
    "crates/pulsar-orm-clickhouse",        # v2.3 sqlx-pattern driver
    "crates/pulsar-audit",
    "crates/pulsar-auth",
    "crates/pulsar-compliance",
    "crates/pulsar-observability",
    "crates/pulsar-search",

    # ─────────────────────────────────────────────────────────────────────
    # Security controls layer (un-fused per Decision 2.51 — was pulsar-guard in v2.2)
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-csrf",                  # v2.3 dé-fusion of pulsar-guard
    "crates/pulsar-sri",                   # v2.3 dé-fusion of pulsar-guard
    "crates/pulsar-incident",              # v2.3 dé-fusion of pulsar-guard
    "crates/pulsar-ratelimit",             # v2.3 dé-fusion of pulsar-guard
    "crates/pulsar-resilience",            # v2.3 dé-fusion of pulsar-guard
    "crates/pulsar-ssrf-guard",            # v2.3 dé-fusion of pulsar-guard

    # ─────────────────────────────────────────────────────────────────────
    # Application infrastructure layer
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-mail",
    "crates/pulsar-queue",
    "crates/pulsar-scheduler",
    "crates/pulsar-cache",
    "crates/pulsar-config",
    "crates/pulsar-storage",
    "crates/pulsar-storage-s3",            # v2.3 sqlx-pattern driver
    "crates/pulsar-storage-azure",         # v2.3 sqlx-pattern driver
    "crates/pulsar-storage-gcs",           # v2.3 sqlx-pattern driver
    "crates/pulsar-storage-fs",            # v2.3 sqlx-pattern driver
    "crates/pulsar-form",
    "crates/pulsar-webhook",
    "crates/pulsar-idempotency",
    "crates/pulsar-notification",
    "crates/pulsar-pagination",
    "crates/pulsar-feature-flag",
    "crates/pulsar-i18n",
    "crates/pulsar-tenancy",

    # ─────────────────────────────────────────────────────────────────────
    # Data protection + Authorization + Identity standards
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-dataprotection",
    "crates/pulsar-consent",
    "crates/pulsar-authz",
    "crates/pulsar-identity-standards",

    # ─────────────────────────────────────────────────────────────────────
    # Application extensions
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-cms",
    "crates/pulsar-forum",
    "crates/pulsar-payments",
    "crates/pulsar-console-api",

    # ─────────────────────────────────────────────────────────────────────
    # API paradigms (un-fused realtime per Decision 2.51 — was pulsar-realtime in v2.2)
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-api",
    "crates/pulsar-graphql",
    "crates/pulsar-grpc",
    "crates/pulsar-mcp-server",
    "crates/pulsar-websocket",             # v2.3 dé-fusion of pulsar-realtime
    "crates/pulsar-sse",                   # v2.3 dé-fusion of pulsar-realtime
    "crates/pulsar-webtransport",          # v2.3 dé-fusion of pulsar-realtime
    "crates/pulsar-broadcasting",          # v2.3 dé-fusion of pulsar-realtime

    # ─────────────────────────────────────────────────────────────────────
    # AI surface
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-ai",
    "crates/pulsar-ai-governance",
    "crates/pulsar-vector-search",
    "crates/pulsar-ai-agents",

    # ─────────────────────────────────────────────────────────────────────
    # Reactive + Developer experience
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-live",
    "crates/pulsar-studio",
    "crates/pulsar-analytics",
    "crates/pulsar-accessibility",

    # ─────────────────────────────────────────────────────────────────────
    # Orchestration (un-fused per Decision 2.51 — was pulsar-orchestration in v2.2)
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-workflow",              # v2.3 dé-fusion of pulsar-orchestration
    "crates/pulsar-saga",                  # v2.3 dé-fusion of pulsar-orchestration

    # ─────────────────────────────────────────────────────────────────────
    # Infrastructure adapters
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-cloud",
    "crates/pulsar-cloud-aws",             # v2.3 sqlx-pattern driver
    "crates/pulsar-cloud-azure",           # v2.3 sqlx-pattern driver
    "crates/pulsar-cloud-gcp",             # v2.3 sqlx-pattern driver
    "crates/pulsar-cloud-oci",             # v2.3 sqlx-pattern driver
    "crates/pulsar-edge",
    "crates/pulsar-supervisor",            # v2.3 dé-fusion of pulsar-cluster
    "crates/pulsar-service-discovery",     # v2.3 dé-fusion of pulsar-cluster
    "crates/pulsar-deploy",

    # ─────────────────────────────────────────────────────────────────────
    # CLI + Test utilities
    # ─────────────────────────────────────────────────────────────────────
    "crates/pulsar-cli",
    "crates/pulsar-test",

    # ─────────────────────────────────────────────────────────────────────
    # Workspace-local automation (cargo-xtask pattern; not published)
    # ─────────────────────────────────────────────────────────────────────
    "tools/xtask",
]

# Note: the Kubernetes Operator lives in `services/operator/` in Go (Decision 2.46), not as a Rust crate.
# Note: the admin SPA lives in `services/admin/` in native HTML5 + ES2025 + Web Components (Decision 2.8), not as a Rust crate.
# Note: tools/xtask is in [workspace.members] so `cargo run -p xtask` works, but excluded from
# [workspace.default-members] so `cargo build` / `cargo test` skip it.

# Default members run on `cargo build` / `cargo test` without --package.
default-members = [
