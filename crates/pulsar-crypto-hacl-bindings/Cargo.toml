[package]
name = "pulsar-crypto-hacl-bindings"
description = "Rust FFI bindings to HACL* (formally verified F* → C) for the twelve classical cryptographic primitives Pulsar uses (AEAD, X25519, P-256, Ed25519, SHA-2/3, BLAKE2, HKDF, HMAC). NIST PQC primitives flow through libcrux per Decision 2.60."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["pulsar", "hacl", "crypto", "fips", "formal-verification"]
categories = ["cryptography", "external-ffi-bindings"]
build = "build.rs"
links = "hacl_pulsar"

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
cc = "1.2"
bindgen = "0.71"

[lints]
workspace = true
