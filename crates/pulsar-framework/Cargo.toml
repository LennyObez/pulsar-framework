[package]
name = "pulsar-framework"
description = "Meta-crate re-exporting the stable public surface of the framework."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
# Stable public surface — every re-exported crate marked "Re-exported in meta. Yes." in Section IV.
# v2.3 update per Decision 2.51: the four v2.2 meta-crates (pulsar-guard,
# pulsar-realtime, pulsar-orchestration, pulsar-cluster) have been dé-fusionnées
# back into 14 sub-module crates. The meta-crate re-exports the same public
# surface but routed through the un-fused crates.
pulsar-kernel = { path = "../pulsar-kernel", version = "=0.0.1-alpha.0" }
pulsar-http = { path = "../pulsar-http", version = "=0.0.1-alpha.0" }
pulsar-engine = { path = "../pulsar-engine", version = "=0.0.1-alpha.0" }
pulsar-orm = { path = "../pulsar-orm", version = "=0.0.1-alpha.0" }
pulsar-audit = { path = "../pulsar-audit", version = "=0.0.1-alpha.0" }
pulsar-auth = { path = "../pulsar-auth", version = "=0.0.1-alpha.0" }
pulsar-compliance = { path = "../pulsar-compliance", version = "=0.0.1-alpha.0" }
pulsar-observability = { path = "../pulsar-observability", version = "=0.0.1-alpha.0" }
pulsar-search = { path = "../pulsar-search", version = "=0.0.1-alpha.0" }
# v2.3: pulsar-guard sub-modules — replaces the v2.2 consolidated pulsar-guard re-export
pulsar-csrf = { path = "../pulsar-csrf", version = "=0.0.1-alpha.0" }
pulsar-sri = { path = "../pulsar-sri", version = "=0.0.1-alpha.0" }
pulsar-incident = { path = "../pulsar-incident", version = "=0.0.1-alpha.0" }
pulsar-ratelimit = { path = "../pulsar-ratelimit", version = "=0.0.1-alpha.0" }
pulsar-resilience = { path = "../pulsar-resilience", version = "=0.0.1-alpha.0" }
pulsar-ssrf-guard = { path = "../pulsar-ssrf-guard", version = "=0.0.1-alpha.0" }
pulsar-dataprotection = { path = "../pulsar-dataprotection", version = "=0.0.1-alpha.0" }
pulsar-consent = { path = "../pulsar-consent", version = "=0.0.1-alpha.0" }
pulsar-authz = { path = "../pulsar-authz", version = "=0.0.1-alpha.0" }
pulsar-identity-standards = { path = "../pulsar-identity-standards", version = "=0.0.1-alpha.0" }
pulsar-ai-governance = { path = "../pulsar-ai-governance", version = "=0.0.1-alpha.0" }
# v2.3: pulsar-orchestration sub-modules — replaces the v2.2 consolidated pulsar-orchestration re-export
pulsar-workflow = { path = "../pulsar-workflow", version = "=0.0.1-alpha.0" }
pulsar-saga = { path = "../pulsar-saga", version = "=0.0.1-alpha.0" }

[lints]
workspace = true
