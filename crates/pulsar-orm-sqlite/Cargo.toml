[package]
name = "pulsar-orm-sqlite"
description = "SQLite driver for pulsar-orm via sqlx-sqlite — single-file embedded + WAL."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["pulsar", "orm", "sqlite", "embedded", "sqlx"]
categories = ["database", "embedded"]

[dependencies]
pulsar-kernel = { path = "../pulsar-kernel", version = "=0.0.1-alpha.0" }
pulsar-orm = { path = "../pulsar-orm", version = "=0.0.1-alpha.0" }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
