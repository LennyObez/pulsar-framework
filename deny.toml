# cargo-deny configuration
# Enforces license, advisory, duplicate, and source policies on every build.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Zero tolerance: fail on any advisory of any severity
yanked = "deny"
ignore = []

[licenses]
version = 2
# Accept only well-known, OSS-compatible licenses (all OSI-approved + FSF Free/Libre).
# Each entry is procurement-acceptable in regulated domains (banking, healthcare,
# legal, government). Copyleft licenses (GPL, AGPL, LGPL, EPL) are deliberately
# excluded; weak copyleft (MPL-2.0) is allowed because it is file-level and does
# not encumber the framework as a whole.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",      # Common in LLVM-derived ecosystem (ar_archive_writer)
    "MIT",
    "MIT-0",                                # MIT No Attribution (some polars + arrow deps)
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",                                 # BSD Zero Clause (quoted_printable via lettre)
    "BSL-1.0",                              # Boost Software License 1.0 (xxhash-rust via polars)
    "ISC",
    "MPL-2.0",                              # Weak copyleft, file-level only
    "Unicode-DFS-2016",                     # Older Unicode crate license
    "Unicode-3.0",                          # Current Unicode crate license
    "Zlib",
    "CC0-1.0",                              # Public domain dedication
    "CDLA-Permissive-2.0",                  # Community Data License Agreement (webpki-roots)
    "OpenSSL",                              # ring exception only, see [[licenses.clarify]] below
]
confidence-threshold = 0.95
# Some crates require explicit exception clauses, listed here
exceptions = [
    { allow = ["OpenSSL"], name = "ring" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Crates explicitly banned
deny = [
    # Insecure or deprecated primitives
    { name = "time", version = "<0.3" },
    { name = "chrono", version = "<0.4.35" },
    # Prefer `ring` + `rustls`; `openssl-sys` acceptable only via ring exception
    { name = "native-tls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
