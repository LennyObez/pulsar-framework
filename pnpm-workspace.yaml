# Security floors for transitive dependencies; never exact pins, so patches still apply.
overrides:
  ajv: '>=6.14.0 <7.0.0'
  brace-expansion: '>=5.0.12'
  esbuild: '>=0.28.1'
  flatted: '>=3.4.2'
  js-yaml: '>=4.3.1'
  minimatch: '>=9.0.6'
  nanoid: '>=3.3.18 <4'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.26'
  rollup: '>=4.59.0'
  undici: '>=7.29.1 <8'
  vite: '>=8.0.16'

# Build scripts run only for packages reviewed here; any other is refused.
allowBuilds:
  esbuild: true
