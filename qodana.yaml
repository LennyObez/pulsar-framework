####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: '1.0'
linter: qodana-php:2025.3
bootstrap: composer install --no-interaction --ignore-platform-reqs
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
exclude:
  # PHP inspections - undefined/unresolved references (expected in framework context)
  - name: PhpUndefinedClassInspection
  - name: PhpUndefinedNamespaceInspection
  # ESLint - not relevant, project uses its own ESLint setup via pnpm
  - name: Eslint
  - name: EsLintInspection
  # PHP 8.5 false positives — jetbrains/qodana-php:2025.3 does not fully support PHP 8.5.
  # These inspections misfire on constructor-promoted properties, named arguments, and
  # property access expressions. PHPStan max + Psalm level 1 are authoritative.
  # Remove these exclusions when upgrading to a Qodana version with PHP 8.5 support.
  - name: PhpUndefinedVariableInspection
  - name: PhpUndefinedConstantInspection
  - name: PhpExpressionResultUnusedInspection
  - name: PhpIllegalArrayKeyTypeInspection
  # #[Override] on PSR interface implementations — Qodana 2025.3 ships PHP 8.4 and cannot
  # verify interface implementations when composer.json requires ^8.5 (PSR packages may
  # fail to install even with --ignore-platform-reqs due to transitive constraints).
  # PHPStan max + Psalm level 1 validate #[Override] correctness authoritatively.
  - name: PhpAttributeIsUsedOnOverriddenMethodInspection
  # Redundant visibility modifier - CS Fixer (PER-CS2.0) enforces explicit `public` on
  # `private(set)` properties; Qodana flags it as redundant. CS Fixer is authoritative.
  - name: PhpPublicPropertyModifierCanBeOmittedInspection
  # @throws inspection trio — these three contradict each other in a framework context:
  # interface contracts declare @throws but concrete analysis sees no throw path (e.g.,
  # has()-guarded get() calls), causing RedundantThrows. Adding @throws to satisfy
  # MissingThrows triggers RedundantThrows elsewhere. UnhandledException cascades up
  # every call chain. PHPStan max + Psalm level 1 are authoritative for throw analysis.
  - name: PhpDocRedundantThrowsInspection
  - name: PhpDocMissingThrowsInspection
  - name: PhpUnhandledExceptionInspection
  # Composer packages - dependencies managed externally, not always installed in CI scan
  - name: PhpNoninstalledComposerPackagesInspection
  # Unused parameters with underscore prefix are intentionally unused (PHP naming convention)
  - name: PhpUnusedParameterInspection
  # ext-pcntl is intentionally in `suggest` (Unix-only, guarded by function_exists())
  # ext-sockets is intentionally in `suggest` (guarded by extension_loaded() at PersistentRuntime:88)
  # ext-apcu is in `suggest` (guarded by extension_loaded() in ApcuDriver/ApcuLock)
  # ext-memcached is in `suggest` (guarded by extension_loaded() in MemcachedDriver/MemcachedLock)
  # ext-intl is in `suggest` (guarded by extension_loaded() in IntlMessageFormatter)
  - name: PhpComposerExtensionStubsInspection
    paths:
      - src/Queue/Worker.php
      - src/Runtime/PersistentRuntime.php
      - src/Runtime/Fiber/FiberScheduler.php
      - src/Runtime/Http/ConnectionContext.php
      - src/Runtime/Upgrade/UpgradeHandlerInterface.php
      - src/Console/Command/RuntimeServeCommand.php
      - src/Cache/Driver/ApcuDriver.php
      - src/Cache/Application/Lock/ApcuLock.php
      - src/Cache/Driver/MemcachedDriver.php
      - src/Cache/Application/Lock/MemcachedLock.php
      - src/I18n/Format/IntlMessageFormatter.php
  # Duplicated code - Studio CLI commands share structural patterns (extract values,
  # format output) but operate on different data; further extraction is over-engineering.
  # Payments gateway/handler share validation and serialization because the handler was
  # extracted from the gateway; remaining methods will migrate in future slices.
  - name: DuplicatedCode
    paths:
      - extensions/studio/src/Command/Console/ConsoleExportCommand.php
      - extensions/studio/src/Command/Console/ConsoleVerifyCommand.php
      - extensions/payments/src/Gateway/PaymentGateway.php
      - extensions/payments/src/Features/CreatePaymentIntent/CreatePaymentIntentHandler.php
      # Payments HmacWebhookVerifier shares verification logic with core copy (lifted from extension)
      - extensions/payments/src/Internal/Infrastructure/Webhook/HmacWebhookVerifier.php
      # DTO fromArray() factories share structural deserialization pattern across Context/Event
      - src/Context/RequestContext.php
      # MCP read tools share pagination logic intentionally — each tool filters differently
      - extensions/mcp-server/src/Internal/Tools/ReadCommandsTool.php
      # Admin dev router shares bootstrap pattern with studio dev router
      - extensions/admin/dev/router.php
      # MariaDB dialect shares most SQL generation with MySQL dialect by design
      - extensions/orm/src/Internal/Compiler/MariaDbDialect.php
      # Relation and batch loaders share query construction for HasMany/BelongsTo patterns
      - extensions/orm/src/Features/Relation/RelationLoader.php
      # Entity dehydrator mirrors hydrator structure by design
      - extensions/orm/src/Features/Hydration/EntityDehydrator.php
      # FormField and SavedViews share DOM manipulation patterns in admin frontend
      - extensions/admin/frontend/src/components/FormField.ts
      # DbSavedViewStore shares SQL CRUD pattern with DbActionHistoryStore
      - extensions/admin/src/Internal/Storage/DbSavedViewStore.php
      # OTLP batch exporters are type-specialized thin wrappers around BatchExporter<T> —
      # each handles a different signal type (spans/logs/metrics) with different builder/path
      - extensions/opentelemetry/src/Internal/Export/SpanBatchExporter.php
      - extensions/opentelemetry/src/Internal/Export/LogsBatchExporter.php
      - extensions/opentelemetry/src/Internal/Export/MetricsBatchExporter.php
      # OTLP transports share constructor URL validation and curl setup but diverge in
      # protocol handling (HTTP/1.1 vs gRPC framing, header parsing, status interpretation)
      - extensions/opentelemetry/src/Internal/Transport/HttpProtobufTransport.php
      - extensions/opentelemetry/src/Internal/Transport/GrpcTransport.php
      # Capability-gated proxies share trust-tier checking pattern but wrap different
      # interfaces (ContainerInterface vs RouterInterface) with different enforcement logic
      - src/Extensibility/Internal/ScopedContainerProxy.php
      - src/Extensibility/Internal/ScopedRouterProxy.php
      # REPL read-only decorators share delegation+throw pattern but implement different
      # interfaces (Container, Storage, CachePool, SimpleCache, Connection)
      - src/Console/Repl/ReadOnlyContainer.php
      - src/Console/Repl/ReadOnlyStorageAdapter.php
      - src/Console/Repl/ReadOnlyCachePool.php
      - src/Console/Repl/ReadOnlySimpleCache.php
      - src/Console/Repl/ReadOnlyConnection.php
  # Accessor → property hook — these getters delegate to a sub-object and live in readonly
  # classes. PHP 8.5 forbids property hooks on readonly properties, so the getters must remain.
  - name: PhpAccessorCanBeReplacedWithPropertyHookInspection
    paths:
      - src/Routing/MatchedRoute.php
  # Closure::fromCallable() → first-class callable — PHPStan max loses Closure parameter/return
  # type information with the $fn(...) syntax. Closure::fromCallable() preserves types correctly.
  # PHPStan max is authoritative; keep Closure::fromCallable() in these files.
  - name: PhpClosureCanBeConvertedToFirstClassCallableInspection
    paths:
      - src/Container/Container.php
      - src/Cache/Application/Event/CacheEventEmitter.php
  # Same parameter value — auditPayment() is designed for reuse across payment
  # operations; currently only cancel_intent calls it, but capture/refund will follow.
  - name: PhpSameParameterValueInspection
    paths:
      - extensions/payments/src/Gateway/PaymentGateway.php
  # Development-only router file and CI scripts reference vendor autoload unavailable during scan
  - name: PhpIncludeInspection
    paths:
      - extensions/studio/dev/router.php
      - extensions/admin/dev/router.php
      - scripts/boundary_check.php
  # PHPDoc signature inspections — template files use extracted variables without type hints;
  # they are not standalone classes and PHPDoc signatures are not meaningful in this context.
  - name: PhpDocSignatureInspection
    paths:
      - extensions/admin/src/Server/View/templates/
  - name: PhpDocSignatureIsNotCompleteInspection
    paths:
      - extensions/admin/src/Server/View/templates/
  - name: All
    paths:
      - composer.json
      - extensions/example/composer.json
      - extensions/payments/composer.json
      - extensions/mcp-server/composer.json
      - extensions/social-sso/composer.json
