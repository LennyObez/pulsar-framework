  # #[Override] validation — without vendor/ in CI, PSR-7/15/17 interfaces can't be
  # resolved, causing false positives on implementing methods. PHPStan max + Psalm
  # level 1 validate #[Override] correctness authoritatively.
  - name: PhpOverriddenMethodExistsInspection
  # Parameter type covariance — without vendor/, Qodana can't resolve interface
  # parameter types. Concrete types passed where interfaces expected is valid PHP
  # covariance. PHPStan max validates parameter types correctly.
  - name: PhpParamsInspection
  # PHP 8.5 clone-with syntax and PSR factory covariant returns — Qodana 2025.3 cannot
  # parse `clone $this with { ... }` syntax or validate covariant return types on PSR
  # interface implementations. PHPStan max + Psalm level 1 are authoritative.
  - name: PhpIncompatibleReturnTypeInspection
    paths:
      # PHP 8.5 clone-with syntax — Qodana 2025.3 cannot parse clone($this, [...])
      - src/Http/Message/Uri.php
      - src/Http/Message/Response.php
      - src/Http/Message/ServerRequest.php
      - src/Http/Message/Stream.php
      - src/Http/Message/UploadedFile.php
      - src/Api/Filter/Filter.php
      # PSR factory covariant returns — concrete implementations returned from PSR
      # interface methods (Response→ResponseInterface, Stream→StreamInterface, etc.).
      # Valid covariance; PHPStan max + Psalm level 1 confirm correctness.
      - src/Http/Factory/
      - src/Cache/Application/CachePool.php
      - src/Cache/Application/CacheManager.php
      - src/ErrorHandling/ExceptionHandler.php
      - src/Routing/Binding/ModelBindingMiddleware.php
      - src/Core/Kernel.php
      - src/Runtime/RoadRunnerRuntime.php
      - src/Api/OpenApi/EndpointScanner.php
      - src/Queue/Attribute/EffectClassifier.php
      # Middleware covariant returns — concrete Response returned where ResponseInterface
      # declared. Valid covariance; PHPStan max confirms correctness.
      - src/Auth/Middleware/
      - src/Http/Middleware/
      - extensions/admin/src/Internal/Middleware/
      - extensions/cms/src/Http/Middleware/
      - extensions/analytics/src/Internal/Middleware/
      - extensions/forum/src/Http/Middleware/
      - extensions/studio/src/Server/Middleware/
      - src/Security/Csrf/CsrfMiddleware.php
      - src/I18n/Locale/LocalePrefixMiddleware.php
  # PHP 8.5 false positive — Qodana 2025.3 misidentifies reachable code as unreachable
  # in notification channels (statements after method calls on readonly constructor-promoted
  # properties). All four channels are structurally identical; PHPStan + Psalm see no issue.
  - name: PhpUnreachableStatementInspection
    paths:
      - src/Notification/Channel/DatabaseChannel.php
      - src/Notification/Channel/WebhookChannel.php
      - src/Notification/Channel/SlackChannel.php
      - src/Notification/Channel/SmsChannel.php
  # Undefined method — without vendor/, PHPUnit TestCase can't be resolved, causing
  # assertion method calls to appear undefined. PHPStan max validates these correctly.
  - name: PhpUndefinedMethodInspection
    paths:
      - extensions/opentelemetry/tests/
  # Undefined function — ext-msgpack and ext-frankenphp functions are optional runtime
  # dependencies not available in CI scan. Guarded by extension_loaded() at runtime.
  - name: PhpUndefinedFunctionInspection
    paths:
      - src/Queue/Serialization/MsgpackSerializer.php
      - src/Runtime/FrankenPhpRuntime.php
  # Property assignment type mismatch — concrete Stream assigned to StreamInterface
  # property is valid covariance. PHPStan max confirms correctness.
  - name: PhpFieldAssignmentTypeMismatchInspection
    paths:
      - src/Http/Message/UploadedFile.php
  # Accessor → property hook — these getters implement PSR-7/framework interface methods
  # or delegate to sub-objects in readonly classes. PHP 8.5 forbids property hooks on
  # readonly properties, and interface-mandated getters cannot become hooks.
  # PHPStan max + Psalm level 1 are authoritative.
  - name: PhpAccessorCanBeReplacedWithPropertyHookInspection
  # Closure::fromCallable() → first-class callable — PHPStan max loses Closure parameter/return
  # type information with the $fn(...) syntax. Closure::fromCallable() preserves types correctly.
  # PHPStan max is authoritative; keep Closure::fromCallable() in these files.
  - name: PhpClosureCanBeConvertedToFirstClassCallableInspection
    paths:
      - src/Container/Container.php
      - src/Cache/Application/Event/CacheEventEmitter.php
  # #[Override] attribute suggestion — Qodana suggests adding #[Override] to interface
  # declarations themselves (which ARE the top-level definitions, not overrides).
  - name: PhpAddOverrideAttributeInspection
    paths:
      - src/Container/ContainerInterface.php
      - src/Security/Session/SessionInterface.php
  # Missing parameter type — PSR-17 createServerRequest($uri) intentionally omits
  # the type constraint to match the interface contract.
  - name: PhpMissingParamTypeInspection
    paths:
      - src/Http/Factory/ServerRequestFactory.php
  # Mixed return type — PSR-11 get() requires `mixed` return per interface contract.
  - name: PhpMixedReturnTypeCanBeReducedInspection
    paths:
      - src/Container/Compiled/CompiledContainer.php
  # Condition always false — renderCsrfField() accepts FormInterface but checks
  # `instanceof Form` as a design guard. The method is part of FormRendererInterface
  # and may receive any implementation. PHPStan + Psalm see no issue.
  - name: PhpStaticallyAnalyzedConditionInspection
    paths:
      - extensions/form/src/Renderer/HtmlFormRenderer.php
  # Self-assignment for PHPStan type narrowing — is_array() only narrows to `array`,
  # but PHPStan max requires `array<string, mixed>`. The @var + self-assignment is the
  # canonical way to narrow generic array types. PHPStan max is authoritative.
  - name: PhpRedundantVariableDocTypeInspection
    paths:
      - src/Queue/Serialization/JsonSerializer.php
      - src/Queue/Serialization/MsgpackSerializer.php
      - src/Queue/Envelope/EnvelopeSerializer.php
  # Same parameter value — these are designed for reuse across multiple operations;
  # currently only one call site, but additional call sites will follow.
  - name: PhpSameParameterValueInspection
    paths:
      - extensions/payments/src/Gateway/PaymentGateway.php
      - extensions/oauth2/src/Exception/OAuth2Exception.php
  # Development-only router file and CI scripts reference vendor autoload unavailable during scan
  - name: PhpIncludeInspection
    paths:
      - extensions/studio/dev/router.php
      - extensions/admin/dev/router.php
      - scripts/boundary_check.php
  # PHPDoc signature inspections — template files use extracted variables without type hints;
  # they are not standalone classes and PHPDoc signatures are not meaningful in this context.
  - name: PhpDocSignatureInspection
    paths:
      - extensions/admin/src/Server/View/templates/
  - name: PhpDocSignatureIsNotCompleteInspection
    paths:
      - extensions/admin/src/Server/View/templates/
  - name: All
    paths:
      - composer.json
      - extensions/example/composer.json
      - extensions/payments/composer.json
      - extensions/mcp-server/composer.json
      - extensions/social-sso/composer.json
