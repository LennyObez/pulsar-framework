####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: '1.0'
linter: jetbrains/qodana-php:2025.3
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
exclude:
  # PHP inspections - undefined/unresolved references (expected in framework context)
  - name: PhpUndefinedClassInspection
  - name: PhpUndefinedNamespaceInspection
  # ESLint - not relevant, project uses its own ESLint setup via pnpm
  - name: Eslint
  - name: EsLintInspection
  # PHP 8.5 false positives — jetbrains/qodana-php:2025.3 does not fully support PHP 8.5.
  # These inspections misfire on constructor-promoted properties, named arguments, and
  # property access expressions. PHPStan max + Psalm level 1 are authoritative.
  # Remove these exclusions when upgrading to a Qodana version with PHP 8.5 support.
  - name: PhpUndefinedVariableInspection
  - name: PhpUndefinedConstantInspection
  - name: PhpExpressionResultUnusedInspection
  # Redundant visibility modifier - CS Fixer (PER-CS2.0) enforces explicit `public` on
  # `private(set)` properties; Qodana flags it as redundant. CS Fixer is authoritative.
  - name: PhpPublicPropertyModifierCanBeOmittedInspection
  # @throws inspection trio — these three contradict each other in a framework context:
  # interface contracts declare @throws but concrete analysis sees no throw path (e.g.,
  # has()-guarded get() calls), causing RedundantThrows. Adding @throws to satisfy
  # MissingThrows triggers RedundantThrows elsewhere. UnhandledException cascades up
  # every call chain. PHPStan max + Psalm level 1 are authoritative for throw analysis.
  - name: PhpDocRedundantThrowsInspection
  - name: PhpDocMissingThrowsInspection
  - name: PhpUnhandledExceptionInspection
  # Composer packages - dependencies managed externally, not always installed in CI scan
  - name: PhpNoninstalledComposerPackagesInspection
  # Unused parameters with underscore prefix are intentionally unused (PHP naming convention)
  - name: PhpUnusedParameterInspection
  # ext-pcntl is intentionally in `suggest` (Unix-only, guarded by function_exists())
  # ext-sockets is intentionally in `suggest` (guarded by extension_loaded() at PersistentRuntime:88)
  - name: PhpComposerExtensionStubsInspection
    paths:
      - src/Queue/Worker.php
      - src/Runtime/PersistentRuntime.php
      - src/Runtime/Fiber/FiberScheduler.php
      - src/Runtime/Http/ConnectionContext.php
      - src/Runtime/Upgrade/UpgradeHandlerInterface.php
      - src/Console/Command/RuntimeServeCommand.php
  # Duplicated code - Studio CLI commands share structural patterns (extract values,
  # format output) but operate on different data; further extraction is over-engineering.
  # Payments gateway/handler share validation and serialization because the handler was
  # extracted from the gateway; remaining methods will migrate in future slices.
  - name: DuplicatedCode
    paths:
      - extensions/studio/src/Command/Console/ConsoleExportCommand.php
      - extensions/studio/src/Command/Console/ConsoleVerifyCommand.php
      - extensions/payments/src/Gateway/PaymentGateway.php
      - extensions/payments/src/Features/CreatePaymentIntent/CreatePaymentIntentHandler.php
  # Same parameter value — auditPayment() is designed for reuse across payment
  # operations; currently only cancel_intent calls it, but capture/refund will follow.
  - name: PhpSameParameterValueInspection
    paths:
      - extensions/payments/src/Gateway/PaymentGateway.php
  # Development-only router file references non-existent autoload
  - name: PhpIncludeInspection
    paths:
      - resources/studio/router.php
  - name: All
    paths:
      - composer.json
      - extensions/example/composer.json
      - extensions/payments/composer.json
