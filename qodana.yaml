  #
  # ════════════════════════════════════════════════════════════════════════════
  # INSPECTIONS NOT INCLUDED (from qodana.cloud recommendations)
  #
  # External tool integrations — require vendor/ or handled by dedicated tools:
  #   MessDetectorValidationInspection, PhpCSFixerValidationInspection,
  #   PhpCSValidationInspection, PhpStanGlobal, JSHint, StandardJS
  #
  # Contradictory pairs — one direction chosen per convention:
  #   PhpArrayAllCanBeConvertedToLoopInspection,
  #   PhpArrayAnyCanBeConvertedToLoopInspection,
  #   PhpArrayFillCanBeConvertedToLoopInspection,
  #   PhpArrayFilterCanBeConvertedToLoopInspection,
  #   PhpArrayFindCanBeConvertedToLoopInspection,
  #   PhpArrayFindKeyCanBeConvertedToLoopInspection,
  #   PhpArrayMapCanBeConvertedToLoopInspection
  #     → We prefer PHP 8.5 array functions over loops (opposite direction)
  #   PhpMatchCanBeReplacedWithSwitchStatementInspection
  #     → We prefer match expressions (PhpIfCanBeReplacedWithMatchExpression included)
  #   PhpShortOpenEchoTagInspection
  #     → We prefer <?= (PhpEchoOpenTagInspection included)
  #   PhpSingleStatementWithBracesInspection
  #     → PER-CS2.0 mandates braces (PhpStatementWithoutBracesInspection included)
  #   ConstantOnRHSOfComparisonJS
  #     → Non-Yoda convention (ConstantOnLHSOfComparisonJS included to catch Yoda)
  #   CssConvertColorToHexInspection + CssConvertColorToRgbInspection
  #     → Mutually contradictory; neither included
  #
  # Doc enforcement vs redundancy:
  #   PhpEnforceDocCommentInspection, PhpMissingDocCommentInspection
  #     → Contradicts "no unnecessary docstrings" convention;
  #       PhpRedundantDocCommentInspection included instead
  #
  # Formatting — CS Fixer (PER-CS2.0) + Prettier are authoritative:
  #   IncorrectFormatting, LongLine
  #
  # Grammar/spelling — too noisy with domain-specific terms:
  #   GrazieInspection, GrazieInspectionRunner, GrazieStyle,
  #   LanguageDetectionInspection, SpellCheckingInspection
  #
  # JS/TS noisy style — flags idiomatic patterns:
  #   AnonymousFunctionJS, BlockStatementJS, BreakStatementJS,
  #   ConditionalExpressionJS, ContinueStatementJS, MagicNumberJS,
  #   NestedFunctionCallJS, NestedFunctionJS, VoidExpressionJS
  #
  # Dependency management — node_modules/vendor not in CI:
  #   NpmUsedModulesInstalled, UpdateDependencyToLatestVersion
  # ════════════════════════════════════════════════════════════════════════════
  #
exclude:
  # ── Vendor directory — dependencies never inspected ─────────────────────────
  - name: All
    paths:
      - vendor
  # ── No vendor/ in CI — unresolvable references ─────────────────────────────
  # Without vendor/ installed, Qodana cannot resolve third-party classes,
  # interfaces, or methods. These produce thousands of false positives.
  # PHPStan max + Psalm level 1 are authoritative for type resolution.
  - name: PhpOverriddenMethodExistsInspection
  - name: PhpParamsInspection
  - name: PhpUndefinedClassInspection
  - name: PhpUndefinedNamespaceInspection
  # ── ESLint — handled by pnpm lint in JS/TS CI job ──────────────────────────
  - name: Eslint
  - name: EsLintInspection
  # ── PHP 8.5 false positives ─────────────────────────────────────────────────
  # Qodana 2025.3 misfires on PHP 8.5 patterns (constructor-promoted properties,
  # named arguments, property access expressions, property hooks).
  # PHPStan max + Psalm level 1 are authoritative. Re-evaluate after Qodana patches.
  - name: PhpExpressionResultUnusedInspection
  - name: PhpIllegalArrayKeyTypeInspection
  - name: PhpUndefinedConstantInspection
  - name: PhpUndefinedVariableInspection
  # CS Fixer (PER-CS2.0) enforces explicit `public` on `private(set)` properties;
  # Qodana flags it as redundant. CS Fixer is authoritative.
  - name: PhpPublicPropertyModifierCanBeOmittedInspection
  # ── @throws inspection trio ─────────────────────────────────────────────────
  # These three contradict each other in a framework context: interface contracts
  # declare @throws but concrete analysis sees no throw path (e.g., has()-guarded
  # get()), causing RedundantThrows. Adding @throws to satisfy MissingThrows
  # triggers RedundantThrows elsewhere. UnhandledException cascades up every
  # call chain. PHPStan max + Psalm level 1 are authoritative for throw analysis.
  - name: PhpDocMissingThrowsInspection
  - name: PhpDocRedundantThrowsInspection
  - name: PhpUnhandledExceptionInspection
  # ── Composer ────────────────────────────────────────────────────────────────
  # Dependencies managed externally, not always installed in CI scan
  - name: PhpNoninstalledComposerPackagesInspection
  # F7.6: PhpUnusedParameterInspection now runs globally. The
  # underscore-prefix convention (interface contract requires the
  # parameter even if the implementation does not use it) lives only
  # in the path list below — anywhere else, an unused parameter is
  # a real signal worth fixing. Re-evaluate the file list when
  # Qodana ships a built-in `m_allowedParameterPrefix=_` setting.
  - name: PhpUnusedParameterInspection
    paths:
      - extensions/example/src/Controller/ExampleController.php
      - extensions/studio/src/Server/Controller/BenchmarkApiController.php
      - extensions/studio/src/Server/Controller/BenchmarkController.php
      - extensions/studio/src/Server/Controller/DatabaseExplorerController.php
      - extensions/studio/src/Server/Controller/DeploymentController.php
      - extensions/studio/src/Server/Controller/ExceptionExplorerController.php
      - extensions/studio/src/Server/Controller/HealthDashboardController.php
      - extensions/studio/src/Server/Controller/LandingController.php
      - extensions/studio/src/Server/Controller/LogExplorerController.php
      - extensions/studio/src/Server/Controller/RequestExplorerController.php
      - extensions/studio/src/Server/Controller/TimelineController.php
      - extensions/studio/src/Server/StudioRouter.php
      - extensions/studio/src/Server/View/ViewRenderer.php
      - src/Dev/Mail/MailPreviewController.php
      - src/ErrorHandling/ExceptionHandler.php
      - src/View/Engine/ProgressiveStreamingEngine.php
      - src/View/Engine/StreamingTemplateEngine.php
      - src/View/Engine/TemplateEngine.php
  # ext-pcntl, ext-apcu, ext-memcached, ext-intl are in `suggest` —
  # optional, guarded by extension_loaded() / function_exists() at runtime
  - name: PhpComposerExtensionStubsInspection
    paths:
      - src/Cache/Application/Driver/ApcuDriver.php
      - src/Cache/Application/Lock/ApcuLock.php
      - src/Cache/Application/Lock/MemcachedLock.php
      - src/Cache/Driver/ApcuDriver.php
      - src/Cache/Driver/MemcachedDriver.php
      - src/Console/Command/RuntimeReloadCommand.php
      - src/Console/Command/RuntimeServeCommand.php
      - src/I18n/Format/IcuMessageFormatter.php
      - src/I18n/Format/IntlCurrencyFormatter.php
      - src/I18n/Format/IntlDateFormatter.php
      - src/I18n/Format/IntlMessageFormatter.php
      - src/I18n/Format/IntlNumberFormatter.php
      - src/I18n/Linter/TranslationLinter.php
      - src/Queue/Worker.php
      - src/Runtime/Fiber/FiberScheduler.php
      - src/Runtime/FrankenPhpRuntime.php
      - src/Runtime/Http/ConnectionContext.php
      - src/Runtime/PersistentRuntime.php
      - src/Runtime/RoadRunnerRuntime.php
      - src/Runtime/Upgrade/UpgradeHandlerInterface.php
  # ── Property hooks — PSR interface methods + readonly properties ────────────
  # PHP 8.5 forbids property hooks on readonly properties, and interface-mandated
  # getters cannot become hooks. All convertible getters already migrated.
  - name: PhpAccessorCanBeReplacedWithPropertyHookInspection
  # ── Clone-with + covariant return types ─────────────────────────────────────
  # Qodana 2025.3 cannot parse clone($this, [...]) syntax or validate covariant
  # return types on PSR interface implementations. PHPStan max + Psalm level 1
  # are authoritative.
  - name: PhpIncompatibleReturnTypeInspection
    paths:
      - extensions/admin/src/Internal/Middleware/
      - extensions/analytics/src/Internal/Middleware/
      - extensions/cms/src/Http/Middleware/
      - extensions/devices/src/Http/Middleware/
      - extensions/forum/src/Http/Middleware/
      - extensions/studio/src/Server/Middleware/
      - extensions/subscriptions/src/Http/Middleware/
      - resources/packs/api/src/
      - src/Api/Filter/Filter.php
      - src/Api/OpenApi/EndpointScanner.php
      - src/Auth/Middleware/
      - src/Cache/Application/CacheManager.php
      - src/Cache/Application/CachePool.php
      - src/Core/Kernel.php
      - src/ErrorHandling/ExceptionHandler.php
      - src/Http/Factory/
      - src/Http/Message/Response.php
      - src/Http/Message/ServerRequest.php
      - src/Http/Message/Stream.php
      - src/Http/Message/UploadedFile.php
      - src/Http/Message/Uri.php
      - src/Http/Middleware/
      - src/I18n/Locale/LocalePrefixMiddleware.php
      - src/Queue/Attribute/EffectClassifier.php
      - src/Routing/Binding/ModelBindingMiddleware.php
      - src/Runtime/RoadRunnerRuntime.php
      - src/Security/Csrf/CsrfMiddleware.php
  # ── PHP 8.5 unreachable statement false positive ────────────────────────────
  # Qodana misidentifies reachable code as unreachable in notification channels
  # (statements after method calls on readonly constructor-promoted properties).
  - name: PhpUnreachableStatementInspection
    paths:
      - src/Notification/Channel/DatabaseChannel.php
      - src/Notification/Channel/SlackChannel.php
      - src/Notification/Channel/SmsChannel.php
      - src/Notification/Channel/WebhookChannel.php
  # ── Undefined method in tests — PHPUnit stubs not available ─────────────────
  # Without vendor/, PHPUnit TestCase can't be resolved, so assertion methods
  # (method(), willReturn(), expects()) appear undefined. Scoped to test dirs
  # only so production code is still checked. PHPStan max validates correctly.
  - name: PhpUndefinedMethodInspection
    paths:
      - extensions/accessibility/tests/
      - extensions/admin/tests/
      - extensions/analytics/tests/
      - extensions/cms/tests/
      - extensions/devices/tests/
      - extensions/feedback/tests/
      - extensions/form/tests/
      - extensions/forum/tests/
      - extensions/graphql/tests/
      - extensions/grpc/tests/
      - extensions/mcp-server/tests/
      - extensions/oauth2/tests/
      - extensions/observability-export/tests/
      - extensions/opentelemetry/tests/
      - extensions/orm/tests/
      - extensions/payments/tests/
      - extensions/psr7-bridge/tests/
      - extensions/releases/tests/
      - extensions/social-sso/tests/
      - extensions/studio/tests/
      - extensions/subscriptions/tests/
      - extensions/webauthn/tests/
      - tests/
  # ── Optional runtime extensions — guarded by extension_loaded() ─────────────
  - name: PhpUndefinedFunctionInspection
    paths:
      - src/Queue/Serialization/MsgpackSerializer.php
      - src/Runtime/FrankenPhpRuntime.php
  # ── Sodium catch clauses ────────────────────────────────────────────────────
  # SodiumException is thrown at runtime by sodium_crypto_* functions but Qodana
  # can't see ext-sodium stubs. Essential for cryptographic error handling.
  - name: PhpRedundantCatchClauseInspection
    paths:
      - src/Security/Crypto/SodiumCipherSuite.php
  # ── Deprecated class usage in psr7-bridge tests ─────────────────────────────
  # Tests intentionally exercise deprecated adapter classes to ensure backwards
  # compatibility doesn't break functionality.
  - name: PhpDeprecationInspection
    paths:
      - extensions/psr7-bridge/tests/
  # ── Covariant property assignment ───────────────────────────────────────────
  # Concrete Stream assigned to StreamInterface property is valid covariance.
  - name: PhpFieldAssignmentTypeMismatchInspection
    paths:
      - src/Http/Message/UploadedFile.php
  # ── Closure::fromCallable() — preserves PHPStan type info ──────────────────
  # PHPStan max loses parameter/return type information with $fn(...) syntax.
  # Closure::fromCallable() preserves types correctly. PHPStan max is authoritative.
  - name: PhpClosureCanBeConvertedToFirstClassCallableInspection
    paths:
      - src/Cache/Application/Event/CacheEventEmitter.php
      - src/Container/Container.php
  # ── #[Override] false positives — interface/trait declarations ──────────────
  # Qodana suggests adding #[Override] to interface method declarations (which
  # ARE the top-level definitions) and to trait hook methods that don't override.
  - name: PhpAddOverrideAttributeInspection
    paths:
      - src/Container/ContainerInterface.php
      - src/I18n/Locale/LocaleUrlResolverInterface.php
      - src/Security/Session/SessionInterface.php
      - src/Storage/StorageAdapterInterface.php
      - src/Testing/Database/RefreshDatabase.php
  - name: PhpAttributeCanBeAddedToOverriddenMemberInspection
    paths:
      - src/Container/ContainerInterface.php
      - src/I18n/Locale/LocaleUrlResolverInterface.php
      - src/Security/Session/SessionInterface.php
      - src/Storage/StorageAdapterInterface.php
