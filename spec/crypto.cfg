\* TLC model-checker configuration for spec/crypto.tla
\*
\* Pulsar Framework — Sprint 1.1 / Phase 1.1.D.1.
\* Bounded model check of the cryptographic key-lifecycle state machine.
\*
\* MaxKeys = 4 — enough to exhibit two concurrent rotations with their
\* successors. Above 4 the state space grows quadratically without
\* surfacing additional behaviours (no-nested-rotation invariant caps
\* the relevant interleavings at 2 simultaneous rotations).

CONSTANTS
    MaxKeys = 4

SPECIFICATION Spec

INVARIANT KeyLifecycleSafety

PROPERTY RotatingEventuallyZeroised
