name: Broken CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security scan
        run: vendor/bin/phpstan analyse
        continue-on-error: true

      - name: Deploy bypass
        run: git commit --no-verify -m "skip hooks"

      - uses: some-org/untrusted-action@main
