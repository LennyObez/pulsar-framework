# The full test suite, run against every supported database engine.
#
# Pulsar supports SQLite, MySQL and PostgreSQL. SQLite needs nothing but the extension;
# the other two need a server, so this file provides them and runs the suite against all
# three in one command:
#
#   docker compose -f tools/docker/compose.yaml run --rm suite
#
# It composes with tools/docker/fulltest.Dockerfile, which provisions the PHP extensions
# the suite's environment-gated tests require and starts Redis and Memcached on loopback
# inside its own container. This file adds the two database servers alongside it.
#
# REPRODUCIBILITY
#
# Image tags match the ones the CI workflow uses, so a local run and a CI run are
# statements about the same software. Any Docker host — Linux, macOS, or Windows through
# Docker Desktop — produces the same containers.
#
# Identical verdicts are not the same as identical results. To compare two runs, compare
# the canonical result digest: the sorted list of every test and its outcome, hashed,
# with timings excluded because they vary by machine. Matching digests are evidence that
# the two environments agree; two runs that both report success are not.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pulsar_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pulsar_test']
      interval: 5s
      timeout: 5s
      retries: 20
    # No published ports: nothing outside the compose network needs to reach it, and
    # binding 5432 on the host would collide with a developer's own PostgreSQL.
    tmpfs:
      # The data directory never outlives the run. A test suite that inherits state from
      # the previous run is a suite whose result depends on what you did yesterday.
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pulsar_test
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -ppassword']
      interval: 5s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  suite:
    build:
      context: ../..
      dockerfile: tools/docker/fulltest.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      # Redis and Memcached are deliberately not services here: the image starts them on
      # loopback inside its own container, which is where the driver tests look for them.
      # DB_<ENGINE>_<SETTING>, matching what the resolver reads. The two servers below
      # neither share credentials nor listen on the same port, so a single shared set
      # cannot describe both.
      DB_MYSQL_HOST: mysql
      DB_MYSQL_PORT: '3306'
      DB_MYSQL_DATABASE: pulsar_test
      DB_MYSQL_USERNAME: root
      DB_MYSQL_PASSWORD: password

      DB_PGSQL_HOST: postgres
      DB_PGSQL_PORT: '5432'
      DB_PGSQL_DATABASE: pulsar_test
      DB_PGSQL_USERNAME: postgres
      DB_PGSQL_PASSWORD: password
      # Records the reason behind every skipped test, so a run reports not just how many
      # tests abstained but why — a platform capability that is genuinely absent reads
      # very differently from a backend that failed to start.
      PULSAR_SKIP_LEDGER_DIR: /app/var/skip-ledger
