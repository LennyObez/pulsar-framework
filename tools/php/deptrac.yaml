deptrac:
  paths:
    - ../../src/
    - ../../extensions/

  exclude_files:
    - '#.*Test\.php$#'
    - '#.*Fixture.*\.php$#'

  # =================================================================
  # Layer definitions — Plan 7: per-module public + internal layers
  #
  # Tiers (dependency direction: down only):
  #   Foundation:     Api, Support
  #   CoreTier:       Container, Config, Core, ErrorHandling
  #   Infrastructure: Http, Routing, Console, Extensibility
  #   Features:       everything else (21 modules)
  #
  # Each module has two layers:
  #   {Module}          — public surface (excludes \Internal\ namespace)
  #   {Module}_Internal  — internal implementation (\Internal\ only)
  #
  # Internal layers may only depend on their own public layer plus
  # Foundation and CoreTier. Cross-module Internal\ access is blocked.
  # =================================================================

  layers:
    # -----------------------------------------------------------------
    # Composition Root — Kernel and Application wire the system.
    # Unrestricted access to all layers (public + internal).
    # -----------------------------------------------------------------
    - name: CompositionRoot
      collectors:
        - type: classLike
          value: ^Pulsar\\Core\\Kernel$
        - type: classLike
          value: ^Pulsar\\Console\\Application$
        - type: classLike
          value: ^Pulsar\\Core\\Wiring\\
        - type: classLike
          value: ^Pulsar\\Console\\Command\\OptimizeCommand$
        - type: classLike
          value: ^Pulsar\\Console\\Command\\BuildCommand$

    # =================================================================
    # Foundation Tier
    # =================================================================

    # --- Api ---
    - name: Api
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Api\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Api\\Internal\\

    - name: Api_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Api\\Internal\\

    # --- Support ---
    - name: Support
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Support\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Support\\Internal\\

    - name: Support_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Support\\Internal\\

    # =================================================================
    # CoreTier
    # =================================================================

    # --- Container ---
    - name: Container
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Container\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Container\\Internal\\

    - name: Container_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Container\\Internal\\

    # --- Config ---
    - name: Config
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Config\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Config\\Internal\\

    - name: Config_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Config\\Internal\\

    # --- Compliance ---
    - name: Compliance
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Compliance\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Compliance\\Internal\\

    - name: Compliance_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Compliance\\Internal\\

    # --- Core (excludes Kernel → CompositionRoot) ---
    - name: Core
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Core\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Core\\Internal\\
            - type: layer
              value: CompositionRoot

    - name: Core_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Core\\Internal\\

    # --- ErrorHandling ---
    - name: ErrorHandling
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\ErrorHandling\\
          must_not:
            - type: classLike
              value: ^Pulsar\\ErrorHandling\\Internal\\

    - name: ErrorHandling_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\ErrorHandling\\Internal\\

    # =================================================================
    # Infrastructure Tier
    # =================================================================

    # --- Http ---
    - name: Http
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Http\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Http\\Internal\\

    - name: Http_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Http\\Internal\\

    # --- Routing ---
    - name: Routing
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Routing\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Routing\\Internal\\

    - name: Routing_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Routing\\Internal\\

    # --- Console (excludes Application → CompositionRoot) ---
    - name: Console
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Console\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Console\\Internal\\
            - type: layer
              value: CompositionRoot

    - name: Console_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Console\\Internal\\

    # --- Extensibility ---
    - name: Extensibility
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Extensibility\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Extensibility\\Internal\\

    - name: Extensibility_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Extensibility\\Internal\\

    # =================================================================
    # Feature Tier (21 modules)
    # =================================================================

    # --- Attribute ---
    - name: Attribute
      collectors:
        - type: bool
