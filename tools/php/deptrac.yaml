    - name: ErrorHandling_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\ErrorHandling\\Internal\\

    # =================================================================
    # Infrastructure Tier
    # =================================================================

    # --- Http ---
    - name: Http
      collectors:
        - type: bool
          must:
            - type: classLike
              value: ^Pulsar\\Http\\
          must_not:
            - type: classLike
              value: ^Pulsar\\Http\\Internal\\

    - name: Http_Internal
      collectors:
        - type: classLike
          value: ^Pulsar\\Http\\Internal\\

    # --- Routing ---
    - name: Routing
      collectors:
        - type: bool
          must:
            - type: classLike
