  # =================================================================
  # Rulesets — defines allowed outgoing dependencies per layer
  #
  # Key structural rules enforced by Deptrac:
  # 1. Internal\ layers may only depend on own public + Foundation + CoreTier
  #    (cross-module Internal\ access is BLOCKED)
  # 2. Extensions depend on core public + CompositionRoot only (no Internal\)
  # 3. CompositionRoot has unrestricted access
  #
  # Tier direction (Foundation → CoreTier → Infrastructure → Features) is
  # NOT enforced here — the custom boundary script handles this via #[Api]
  # targeting. All public layers may depend on all other public layers at
  # the Deptrac level. This keeps Deptrac focused on the structural
  # Internal\ fence while avoiding false positives from legitimate
  # cross-tier dependencies (Console commands → Features, Config DTOs →
  # domain types, etc.).
  # =================================================================

  ruleset:
    # -----------------------------------------------------------------
    # Composition Root — unrestricted (wires everything together)
    # -----------------------------------------------------------------
    CompositionRoot:
      - AI
      - AI_Internal
      - Api
      - Api_Internal
      - Support
      - Support_Internal
      - Broadcasting
      - Broadcasting_Internal
      - Container
      - Container_Internal
      - Cloud
      - Cloud_Internal
      - Compliance
      - Compliance_Internal
      - Config
      - Config_Internal
      - Core
      - Core_Internal
      - Dev
      - Dev_Internal
      - ErrorHandling
      - ErrorHandling_Internal
      - Http
      - Http_Internal
      - ImportExport
      - ImportExport_Internal
      - Pagination
      - Pagination_Internal
      - Routing
      - Routing_Internal
      - Console
      - Console_Internal
      - Extensibility
      - Extensibility_Internal
      - Attribute
      - Attribute_Internal
      - Audit
      - Audit_Internal
      - Auth
      - Auth_Internal
      - Build
      - Build_Internal
      - Cache
      - Cache_Internal
      - Codegen
      - Codegen_Internal
      - Context
      - Context_Internal
      - Database
      - Database_Internal
      - DataProtection
      - DataProtection_Internal
      - Deploy
      - Deploy_Internal
      - Event
      - Event_Internal
      - FeatureFlag
      - FeatureFlag_Internal
      - I18n
      - I18n_Internal
      - Idempotency
      - Idempotency_Internal
      - Integrity
      - Integrity_Internal
      - Observability
      - Observability_Internal
      - Queue
      - Queue_Internal
      - Resilience
      - Resilience_Internal
      - Runtime
      - Runtime_Internal
      - Saga
      - Saga_Internal
      - Scheduler
      - Scheduler_Internal
      - Security
      - Security_Internal
      - ServiceDiscovery
      - ServiceDiscovery_Internal
      - Storage
      - Storage_Internal
      - Supervisor
      - Supervisor_Internal
      - Tenancy
      - Tenancy_Internal
      - Testing
      - Testing_Internal
      - Mail
      - Mail_Internal
      - Notification
      - Notification_Internal
      - View
      - View_Internal
      - Webhook
      - Webhook_Internal
      - Workflow
      - Workflow_Internal
      - Documentation
      - Documentation_Internal
      - Edge
      - Edge_Internal
      - Inertia
      - Inertia_Internal
      - Live
      - Live_Internal
      - Marketplace
      - Marketplace_Internal
      - Rendering
      - Rendering_Internal
      - SupplyChain
      - SupplyChain_Internal
      - Ui
      - Ui_Internal
      - WebSocket
      - WebSocket_Internal
      - Filesystem
      - Filesystem_Internal
      - Uid
      - Uid_Internal
      - Introspection
      - Introspection_Internal
      # Extension layers (CompositionRoot wires these too)
      - OrmContracts
      - OrmDomain
      - OrmInternal
      - AdminContracts
      - AdminDomain
      - AdminInternal
      - OpenTelemetryExtension
      - OpenTelemetryExtension_Internal
      - CmsExtension
      - CmsExtension_Internal
      - GrpcExtension
      - GrpcExtension_Internal

    # -----------------------------------------------------------------
    # Public Layers — all public layers may depend on all other public
    # layers + CompositionRoot. The custom boundary script enforces
    # #[Api] targeting for cross-module imports.
    # -----------------------------------------------------------------
    Api: &public_deps
      - CompositionRoot
      - AI
      - Api
      - Support
      - Container
      - Compliance
      - Config
      - Core
