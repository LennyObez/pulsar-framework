rules:
  # ADR-0006 enforcement: the framework restricts itself to libsodium primitives
  # for all security-critical hashing. `hash('sha256', ...)` is allowed only in
  # explicit RFC-compatibility zones (AWS Signature v4, WebAuthn, PKCE, file
  # build fingerprints, audit chain export hashes that interoperate with
  # external verifiers). Any other call site must use
  # `sodium_crypto_generichash($input, $context, 32)` (BLAKE2b) or
  # `hash_hmac('sha256', $input, $key)` (HMAC) instead.
  #
  # New code introducing `hash('sha256', ...)` outside the allowlist below is a
  # boundary violation and will fail CI. To extend the allowlist, document the
  # external interoperability requirement in an ADR amendment and add the path
  # to `paths.exclude`.
  - id: pulsar.security.forbidden-sha256
    languages: [php]
    # WARNING (not ERROR) so the rule does not break CI on the existing
    # call sites still on SHA-256. Each finding is a remediation candidate
    # for future sessions of `memory/remediation-plan.md`. New code introducing
    # a SHA-256 call outside the allowlist below is expected to be rejected
    # by the same warning during review.
    severity: WARNING
    message: >
      `hash('sha256', ...)` is discouraged outside RFC interoperability zones
      (ADR-0006 libsodium-only policy). Replace with
      `sodium_crypto_generichash($input, '<context>', 32)` and hex-encode if
      a fixed-width digest is required, or with `hash_hmac('sha256', $input,
      $key)` if a keyed signature is needed for external verification.
    pattern-either:
      - pattern: hash('sha256', ...)
      - pattern: hash("sha256", ...)
    paths:
      exclude:
        # Vendor + build artefacts.
        - 'vendor/**'
        - 'node_modules/**'
        - 'storage/**'
        - 'public/build/**'

        # AWS Signature v4: SHA-256 mandated by AWS spec.
        - 'src/Cloud/Aws/**'

        # WebAuthn: RP ID hash and clientDataJSON hash mandated by W3C spec.
        - 'extensions/webauthn/**'
        - 'extensions/auth/src/WebAuthn/**'

        # PKCE: SHA-256 challenge mandated by RFC 7636.
        - 'extensions/social-sso/**'

        # Build / cache fingerprints — non-security usage. SHA-256 is fine for
        # accidental-corruption detection on local artefacts.
        - 'src/Cache/**'
        - 'src/Codegen/**'
        - 'src/Console/Command/BuildCommand.php'
        - 'src/Console/Command/Make/Template/**'
        - 'src/View/Engine/TemplateCache.php'
        - 'src/Extension/Compiler/**'
        - 'src/Observability/ErrorTracking/ErrorFingerprint.php'

        # Test fixtures may stub W3C / RFC vectors; the production code under
        # the same paths is what matters for the rule.
        - 'tests/**'
        - 'extensions/*/tests/**'

        # Studio / observability hash-chain integrity tooling — currently uses
        # SHA-256 for backwards compatibility with on-disk data. Tracked
        # separately for migration to keyed BLAKE2b in a future session.
        - 'extensions/studio/src/**'
        - 'extensions/observability/src/**'
        - 'extensions/subscriptions/src/**'

  # Forbid raw `md5(...)` and `sha1(...)` outside the same allowlist —
  # neither is collision-resistant and neither has a keyed mode in stdlib.
  - id: pulsar.security.forbidden-broken-hash
    languages: [php]
    severity: WARNING
    message: >
      `md5()` and `sha1()` are broken hash functions (collision attacks
      exist). Use `sodium_crypto_generichash($input, '<context>', 32)`
      (BLAKE2b) for any non-RFC-mandated digest.
    pattern-either:
      - pattern: md5(...)
      - pattern: sha1(...)
      - pattern: hash('md5', ...)
      - pattern: hash("md5", ...)
      - pattern: hash('sha1', ...)
      - pattern: hash("sha1", ...)
    paths:
      exclude:
        - 'vendor/**'
        - 'node_modules/**'
        - 'storage/**'
        - 'public/build/**'
        - 'tests/**'
        - 'extensions/*/tests/**'
        # WebSocket handshake: RFC 6455 §1.3 mandates SHA-1 of the client
        # key concatenated with the magic GUID. SHA-1 is required by the
        # spec; a BLAKE2b replacement would break browser interoperability.
        - 'src/WebSocket/**'
