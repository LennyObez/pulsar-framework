# NOTHING IN CI RUNS THIS FILE. No workflow under `.github/` invokes Semgrep;
# the only entry point is `composer security:lint`, which is part of the local
# `composer qa` sequence and exits 0 whatever it finds, because `--error` is not
# passed and every rule here is severity WARNING. Read the findings as review
# material, not as a gate — a rule in this file cannot stop a merge.
#
# The one clause of ADR-0006 that IS gated lives elsewhere: MD2/MD4/MD5/SHA-1
# are rejected by `Pulsar\PHPStan\Rules\ForbidBrokenHashRule`, registered in
# `tools/php/phpstan.neon`, so `composer phpstan` — a required CI context —
# fails the build on a broken digest. That rule used to be
# `pulsar.security.forbidden-broken-hash` here and was removed rather than
# duplicated: two copies of one policy drift, and the copy that cannot fail is
# the one people stop reading.
#
# The ASVS 10.1.1 malicious-code rules are deliberately NOT here either. Measured
# with semgrep 1.155.0: its PHP frontend fails to parse 2064 of the 2579 files
# under `src/` — it rejects the `readonly` class modifier and named arguments
# inside attributes, both of which this codebase uses everywhere — and a parse
# failure truncates the file rather than degrading. The gate is
# `tools/security/assert-no-malicious-code.php`, built on PHP's own tokenizer,
# and `composer security:malicious` runs it in CI.
rules:
  # ADR-0006 preference: the framework restricts itself to libsodium primitives
  # for all security-critical hashing. `hash('sha256', ...)` is allowed only in
  # explicit RFC-compatibility zones (AWS Signature v4, WebAuthn, PKCE, file
  # build fingerprints, audit chain export hashes that interoperate with
  # external verifiers). Any other call site should use BLAKE2b via
  # `sodium_crypto_generichash()`, or `hash_hmac('sha256', $input, $key)` (HMAC)
  # where an external party must verify the digest.
  #
  # Mind the second parameter of `sodium_crypto_generichash()`: it is a KEY, and
  # libsodium accepts only `''` or 16-64 bytes there. Passing a short domain
  # string throws SodiumException at runtime.
  #
  # This preference is NOT enforced and must not be cited as a control. Roughly
  # 57 call sites outside the allowlist below still hash with unkeyed SHA-256,
  # several of them over credential material, and no gate rejects the next one.
  # SHA-256 is an ASVS-approved algorithm, so the gap is an ADR-0006 migration
  # debt rather than an ASVS V6.2 failure — see the V6.2 row of
  # `docs/security/asvs-l2-matrix.md`, which states it. Promoting this rule to
  # ERROR means migrating those call sites first; it is not a severity edit.
  - id: pulsar.security.forbidden-sha256
    languages: [php]
    severity: WARNING
    message: >
      `hash('sha256', ...)` is discouraged outside RFC interoperability zones
      (ADR-0006 libsodium-only policy). Replace with BLAKE2b, hex-encoding the
      result if a fixed-width digest is required. The second argument of
      `sodium_crypto_generichash()` is a key, not a label: it must be `''` or
      16-64 bytes, so a short domain string throws. Use one of the two correct
      forms -- `sodium_crypto_generichash($domain . "\0" . $input, '', 32)` for
      an unkeyed digest with the domain folded into the message, or
      `sodium_crypto_generichash($input, $subKey, 32)` with a 32-byte key
      derived from MasterKey when the digest must resist forgery. Use
      `hash_hmac('sha256', $input, $key)` only when an external party has to
      verify the digest.
    pattern-either:
      - pattern: hash('sha256', ...)
      - pattern: hash("sha256", ...)
    paths:
      exclude:
        # Vendor + build artefacts.
        - 'vendor/**'
        - 'node_modules/**'
        - 'storage/**'
        - 'public/build/**'

        # AWS Signature v4: SHA-256 mandated by AWS spec.
        - 'src/Cloud/Aws/**'

        # WebAuthn: RP ID hash and clientDataJSON hash mandated by W3C spec.
        - 'extensions/auth/src/WebAuthn/**'

        # Build / cache fingerprints — non-security usage. SHA-256 is fine for
        # accidental-corruption detection on local artefacts.
        - 'src/Cache/**'
        - 'src/Codegen/**'
        - 'src/Console/Command/BuildCommand.php'
        - 'src/Console/Command/Make/Template/**'
        - 'src/View/Engine/TemplateCache.php'
        - 'src/Extension/Compiler/**'
        - 'src/Observability/ErrorTracking/ErrorFingerprint.php'

        # Test fixtures may stub W3C / RFC vectors; the production code under
        # the same paths is what matters for the rule.
        - 'tests/**'
        - 'extensions/*/tests/**'

        # Studio / observability hash-chain integrity tooling — currently uses
        # SHA-256 for backwards compatibility with on-disk data. Tracked
        # separately for migration to keyed BLAKE2b in a future session.
        - 'extensions/studio/src/**'
        - 'extensions/observability/src/**'
        - 'extensions/subscriptions/src/**'

  # `pulsar.security.forbidden-broken-hash` used to sit here, forbidding raw
  # `md5()` and `sha1()`. It is now `Pulsar\PHPStan\Rules\ForbidBrokenHashRule`,
  # which `composer phpstan` runs on every pull request and which fails the
  # build. It also covers what the pattern list here missed: `md5_file()`,
  # `sha1_file()`, `hash_file()`, `hash_init()`, `hash_hmac()`, `hash_pbkdf2()`,
  # named arguments, and an algorithm held in a class constant. Do not restore a
  # copy in this file.

  # The Database\Statement::execute() default path
  # materialises results via PDOStatement::fetchAll(), which OOMs on
  # exports / reporting / tenant-wide dumps. The framework already exposes a
  # streaming variant (Statement::executeStreaming()) that yields rows lazily.
  # Repository classes whose names contain `Export`, `Report`, or `Backfill`
  # MUST NOT call ->execute() on a statement (use ->executeStreaming() and a
  # generator instead). New non-streaming code in those classes is rejected
  # by this rule.
  - id: pulsar.security.export-fetchall-forbidden
    languages: [php]
    severity: WARNING
    message: >
      `Statement::execute()` materialises the full result set via fetchAll()
      and will OOM on export / report / backfill paths. Use
      `executeStreaming()` and iterate the returned generator instead.
    patterns:
      - pattern: $STMT->execute(...)
      - metavariable-regex:
          metavariable: $STMT
          regex: .*(export|report|backfill).*
    paths:
      exclude:
        - 'vendor/**'
        - 'node_modules/**'
        - 'tests/**'
        - 'extensions/*/tests/**'
